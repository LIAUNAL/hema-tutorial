<style>
:root{--bg:#f7f5f0;--panel:#ffffff;--side:#0f1b2d;--side-ink:#dbe4ef;--side-mute:#8fa1b8;--ink:#17202c;--mute:#5b6676;--line:#e3ded3;--acc:#c2410c;--acc-soft:#fdeee5;--chip:#e6f2f5;--chip-ink:#0e5a6e;--code:#f1eee7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c121b;--panel:#131b26;--side:#070b11;--side-ink:#d6dfeb;--side-mute:#7b8ba0;--ink:#e6ebf2;--mute:#9aa7b8;--line:#253041;--acc:#fb923c;--acc-soft:#2a1a10;--chip:#12313a;--chip-ink:#8fd6e6;--code:#1a2432}}
:root[data-theme="dark"]{--bg:#0c121b;--panel:#131b26;--side:#070b11;--side-ink:#d6dfeb;--side-mute:#7b8ba0;--ink:#e6ebf2;--mute:#9aa7b8;--line:#253041;--acc:#fb923c;--acc-soft:#2a1a10;--chip:#12313a;--chip-ink:#8fd6e6;--code:#1a2432}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:320px 1fr}
aside{background:var(--side);color:var(--side-ink);height:100vh;position:sticky;top:0;overflow-y:auto;padding:26px 0 20px}
.brand{padding:0 24px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-size:22px;letter-spacing:.02em}
.brand span{color:var(--side-mute);font-size:14px}
nav ol{list-style:none;margin:12px 0;padding:0}
nav a{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;padding:9px 24px;color:var(--side-ink);text-decoration:none;font-size:15px;line-height:1.35;border-left:4px solid transparent}
nav a:hover{background:rgba(255,255,255,.05)}
nav a[aria-current="true"]{background:rgba(251,146,60,.12);border-left-color:#fb923c;color:#fff}
nav a .k{color:var(--side-mute);font-variant-numeric:tabular-nums;font-weight:700}
.help{padding:14px 24px;color:var(--side-mute);font-size:13px;border-top:1px solid rgba(255,255,255,.08)}
.help kbd{background:rgba(255,255,255,.1);border-radius:4px;padding:1px 6px;font:12px ui-monospace,monospace;color:var(--side-ink)}
.help button{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--side-ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
main{padding:34px 48px 60px;max-width:1240px;width:100%}
.eyebrow{color:var(--acc);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
h1{font-size:34px;line-height:1.15;margin:6px 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.summary{color:var(--mute);max-width:75ch;margin:0 0 6px}
.users{color:var(--mute);font-size:13px;margin:0 0 18px}
.doc .mermaid{background:#fff;border-radius:8px;padding:12px;margin:12px 0;overflow-x:auto;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font:600 15px/1 inherit;font-family:inherit;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.pane{display:none}.pane.on{display:block}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.vbar{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.vbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 32px 24px;max-width:90ch}
.doc h2,.doc h3,.doc h4{line-height:1.25;margin:1.4em 0 .5em}
.doc h4{font-size:19px;color:var(--acc)}
.doc table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
.doc pre{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto}
.doc pre code{background:none;padding:0}
.doc .src{color:var(--mute);font-size:13px;margin-top:16px}
.pager{display:flex;justify-content:space-between;margin-top:28px;gap:12px}
.pager a{color:var(--acc);text-decoration:none;font-weight:600}
body.presenter{grid-template-columns:1fr}
body.presenter aside,body.presenter .tabs,body.presenter .users,body.presenter .pager{display:none}
body.presenter main{max-width:none;padding:20px 40px}
body.presenter h1{font-size:52px}body.presenter .summary{font-size:24px;max-width:none}body.presenter .chip{font-size:20px}
body.presenter .pane{display:none}body.presenter #p-video{display:block}
body.presenter video{max-height:78vh;width:auto;max-width:100%;margin:0 auto}
video::cue{font-size:120%;background:rgba(0,0,0,.75)}
@media (max-width:860px){body{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:20px 16px}.doc{padding:4px 16px 16px}}
</style>

<script>
const DATA = [{"n": 1, "titulo": "Ingreso, sesión única y menú por rol", "roles": ["Cualquier usuario", "Administrador"], "prd": ["### Acceso y cuenta"], "historias": ["H-2.1", "H-2.2", "H-2.3", "H-2.4", "H-2.7"], "spec": ["### Sesión única y bloqueo", "### Permisos y menús"], "resumen": "Cómo se entra a Hēma con usuario y contraseña, cómo se restaura la clave, por qué cada usuario tiene una sola sesión abierta y cómo el menú lateral cambia según el rol.", "usuarios": "qa.administrador, qa.beneficiario", "video": "videos/cap01.mp4", "vtt": "WEBVTT\n\n1\n00:00:03.100 --> 00:00:05.067\nCapítulo uno.\n\n2\n00:00:05.017 --> 00:00:10.525\nCómo se entra a Hēma, por qué la sesión es única y cómo cambia el menú según el rol.\n\n3\n00:00:11.134 --> 00:00:13.922\nTodo empieza en la página de ingreso.\n\n4\n00:00:13.872 --> 00:00:17.544\nCada persona escribe su usuario y su contraseña.\n\n5\n00:00:18.160 --> 00:00:24.373\nSi olvidó la contraseña, el enlace de restaurar le envía un correo para definir una nueva.\n\n6\n00:00:24.946 --> 00:00:34.271\nPor seguridad, después de varios intentos fallidos la cuenta se bloquea un tiempo, y cada usuario solo puede tener una sesión abierta a la vez.\n\n7\n00:00:34.828 --> 00:00:37.473\nEntremos como administrador.\n\n8\n00:00:38.038 --> 00:00:40.540\nA la izquierda aparece el menú.\n\n9\n00:00:40.490 --> 00:00:48.406\nEl administrador ve usuarios, formularios, cronograma y reportes, porque esos son sus permisos.\n\n10\n00:00:49.024 --> 00:00:56.122\nSi alguien intenta abrir una página que no le corresponde, Hēma le muestra un aviso claro de que no tiene permiso.\n\n11\n00:00:56.674 --> 00:01:02.418\nDesde su nombre, arriba, puede cambiar su contraseña o cerrar la sesión.\n\n12\n00:01:02.368 --> 00:01:07.563\nSi deja la pantalla quieta, Hēma le avisa antes de que la sesión venza.\n\n13\n00:01:08.164 --> 00:01:12.384\nCerramos la sesión y entramos ahora como beneficiario.\n\n14\n00:01:12.934 --> 00:01:19.251\nEl menú es otro: mi postulación, diagnóstico, firmas y seguimiento.\n\n15\n00:01:19.201 --> 00:01:22.052\nCada rol ve solo lo que necesita.\n\n", "prd_html": "<h3>Acceso y cuenta<\/h3>\n<ul>\n<li>FR001. El sistema permite ingresar con usuario (máximo 30 caracteres) y contraseña (máximo 50), ambos obligatorios, y lleva a la persona a la página por defecto de su rol; sin rol, al formulario principal.\n  Criterio: dado un usuario activo con credenciales válidas, cuando pulsa «Ingresar», entonces entra a la página de su rol. (RF-01; SPEC)<\/li>\n<li>FR002. Si las credenciales son incorrectas o hay un campo vacío, el sistema no inicia sesión y muestra «Usuario y/o contraseña son incorrectos» o «El campo es obligatorio».\n  Criterio: dado un usuario con contraseña errada, cuando pulsa «Ingresar», entonces ve el mensaje y no entra. (RF-01)<\/li>\n<li>FR003. Donde el reCAPTCHA esté habilitado, el sistema lo exige antes de enviar el ingreso. Se habilita en producción y se puede apagar por configuración en desarrollo (supuesto SUP11).\n  Criterio: dado reCAPTCHA habilitado, cuando se envía el ingreso sin resolverlo, entonces el sistema lo rechaza. (RF-01; P-46)<\/li>\n<li>FR004. El sistema bloquea la cuenta tras varios intentos fallidos seguidos y avisa por correo cómo recuperarla. El número de intentos es un parámetro; se conserva el valor que usa hoy el código.\n  Criterio: dado un usuario que supera el máximo de intentos, cuando intenta ingresar de nuevo, entonces el acceso se rechaza y recibe el correo. (código; P-46)<\/li>\n<li>FR005. El sistema rechaza un nuevo ingreso mientras la cuenta tenga una sesión activa y muestra «El usuario ya tiene una sesión activa en el sistema.».\n  Criterio: dado un usuario con sesión en un navegador, cuando ingresa desde otro, entonces ve el mensaje. (RF-02)<\/li>\n<li>FR006. El sistema libera la sesión activa al cerrar sesión, a más tardar 15 minutos después de cerrar el navegador (supuesto SUP12) y al vencer la inactividad.\n  Criterio: dado un usuario que cierra el navegador sin cerrar sesión, cuando pasan 15 minutos, entonces puede ingresar desde otro equipo. (RF-02; P-45)<\/li>\n<li>FR007. Tras una hora sin actividad, el sistema avisa durante 10 segundos y cierra la sesión.\n  Criterio: dado un usuario inactivo una hora, cuando termina el aviso, entonces vuelve al ingreso. (código; P-45)<\/li>\n<li>FR008. El sistema envía al correo registrado el enlace para definir contraseña cuando el usuario y el correo coinciden; si no coinciden informa el error y no envía nada.\n  Criterio: dado un usuario y un correo que no coinciden, cuando pulsa «Restaurar contraseña», entonces ve el error y no recibe correo. (RF-03)<\/li>\n<li>FR009. El enlace de contraseña lleva un token de un solo uso que vence a las 24 horas (supuesto SUP13). El número de usuario solo no basta.\n  Criterio: dado un enlace ya usado o vencido, cuando se abre, entonces el sistema lo rechaza y ofrece pedir uno nuevo. (RF-03, RF-04; C-26, P-44)<\/li>\n<li>FR010. El sistema permite crear la contraseña desde el enlace, sin sesión, con contraseña y confirmación obligatorias que coincidan.\n  Criterio: dado un enlace válido, cuando la persona guarda dos contraseñas iguales y conformes, entonces queda guardada y puede ingresar; si no coinciden ve «La confirmación no es el mismo dato ingresado». (RF-04)<\/li>\n<li>FR011. El servidor valida la política de contraseña en toda creación o cambio: al menos una mayúscula, un número, un carácter especial, mínimo 6 caracteres y sin las secuencias numéricas que el código ya rechaza.\n  Criterio: dado un cambio hecho llamando directamente al servicio con «abc123», cuando se envía, entonces el servidor lo rechaza igual que el navegador. (RF-04, RF-07, RF-12; SUP14)<\/li>\n<li>FR012. El usuario con sesión cambia su contraseña indicando la actual, la nueva y su repetición; «Guardar» se habilita solo con datos válidos y el servidor comprueba la contraseña actual.\n  Criterio: dado una contraseña actual incorrecta, cuando guarda, entonces el cambio se rechaza. (RF-07)<\/li>\n<li>FR013. El menú lateral muestra solo las categorías y opciones que el rol puede usar, se despliega y contrae por categoría y se cierra al elegir una opción.\n  Criterio: dado un usuario de rol sin acceso a «Reportes», cuando abre el menú, entonces no ve esa opción. (RF-05)<\/li>\n<li>FR014. El encabezado muestra el nombre del usuario y, al pulsarlo, «Cambiar contraseña» y «Cerrar sesión».\n  Criterio: dado un usuario con sesión, cuando pulsa su nombre, entonces ve las dos opciones. (RF-06)<\/li>\n<li>FR015. Al cerrar sesión el sistema borra los datos de sesión del navegador, avisa al servidor para liberarla y lleva al ingreso.\n  Criterio: dado un usuario que cierra sesión, cuando usa el botón «Atrás», entonces no ve páginas privadas. (RF-08)<\/li>\n<li>FR016. Si alguien sin sesión abre una ruta privada, el sistema lo lleva al ingreso.\n  Criterio: dado un navegador sin sesión, cuando abre la dirección de «Usuarios», entonces llega al ingreso. (RF-08)<\/li>\n<\/ul>", "historia_html": "<h4>H-2.1 Ingresar con usuario y contraseña<\/h4>\n<p>Es la pantalla de ingreso y el servicio que valida las credenciales con Keycloak y lleva a la página del rol. Sirve para que cada persona entre a lo suyo.<\/p>\n<p>Como persona con cuenta, quiero ingresar con mi usuario y contraseña, para llegar a la página de mi rol.<\/p>\n<p>De dónde sale: PRD («Acceso y cuenta»), UX («Ingresar»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#ingreso\">Ver la pantalla<\/a>, con <a href=\"../ux/prototipo.html#ingreso-error\">credenciales incorrectas<\/a> y <a href=\"../ux/prototipo.html#ingreso-vacio\">campos vacíos<\/a>.<\/p>\n<p>Servicio: <code>POST /api/acceso/ingreso<\/code>, público. Recibe <code>{\"usuario\":\"usuario.ejemplo01\",\"contrasena\":\"…\",\"captcha\":\"…\"}<\/code> y responde la sesión con el perfil (rol, permisos y menú). Con datos incorrectos responde 401 con el mensaje.<\/p>\n<p>Cómo se sabe que está lista:\n- Con credenciales válidas, la persona llega a la página por defecto de su rol; sin rol, al formulario principal.\n- Con credenciales incorrectas ve «Usuario y/o contraseña son incorrectos» y no entra.\n- Con un campo vacío ve «El campo es obligatorio» junto al campo; el usuario admite hasta 30 caracteres y la contraseña hasta 50.\n- Con reCAPTCHA habilitado, el servidor rechaza el envío sin resolverlo; en desarrollo se apaga por configuración.\n- Con reCAPTCHA habilitado, la pantalla muestra el widget y envía su respuesta; sin resolverlo no se puede ingresar.\n- Sin sesión, abrir una ruta privada lleva al ingreso.<\/p>\n<p>Cubre: ingreso y página por rol (FR001), mensajes de error (FR002), reCAPTCHA (FR003), ruta privada sin sesión al ingreso (FR016), mensajes como en SPEC (UX-DR002). Depende de: H-1.3, H-1.4.<\/p>\n<h4>H-2.2 Bloqueo por intentos y sesión única<\/h4>\n<p>Es la regla que bloquea la cuenta tras varios intentos fallidos y la que permite una sola sesión por usuario. Sirve para frenar adivinadores de contraseña y evitar cuentas compartidas.<\/p>\n<p>Como administradora de la plataforma, quiero que una cuenta se bloquee tras varios fallos y que no haya dos sesiones a la vez, para proteger las cuentas.<\/p>\n<p>De dónde sale: PRD («Acceso y cuenta»), arquitectura («Sesión única y bloqueo»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#ingreso-bloqueada\">cuenta bloqueada<\/a> y <a href=\"../ux/prototipo.html#ingreso-sesion-activa\">sesión ya abierta<\/a>.<\/p>\n<p>Servicio: tabla de sesiones activas con el último latido; <code>POST /api/acceso/latido<\/code> (con sesión) y <code>POST /api/acceso/cierre<\/code> (con sesión).<\/p>\n<p>Cómo se sabe que está lista:\n- Tras superar el número de intentos (parámetro, con el valor del código actual), la cuenta se bloquea y llega un correo con los pasos para recuperarla.\n- Si el usuario ya tiene sesión y entra desde otro navegador, ve «El usuario ya tiene una sesión activa en el sistema.».\n- La sesión se libera al cerrar sesión y a los 15 minutos sin latido.\n- Una petición anónima con el número de otro usuario no cierra su sesión.<\/p>\n<p>Cubre: bloqueo y correo (FR004), sesión única (FR005), liberación a los 15 minutos (FR006), no cerrar la sesión de otra persona (FR031). Depende de: H-2.1, H-1.6.<\/p>\n<h4>H-2.3 Sesión por vencer y cierre de sesión<\/h4>\n<p>Es el aviso de inactividad, el cierre de sesión limpio y la renovación del acceso mientras la persona trabaja. Sirve para que un equipo olvidado no deje abierta una cuenta y para que quien trabaja no sea sacada a mitad de tarea.<\/p>\n<p>Como persona que usa un equipo compartido, quiero que mi sesión se cierre sola y que «Cerrar sesión» borre todo, para que nadie más vea mis datos.<\/p>\n<p>De dónde sale: PRD («Acceso y cuenta»), UX («Ingresar»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#sesion-expira\">Ver la pantalla<\/a>.<\/p>\n<p>Servicio: <code>POST /api/acceso/renovar<\/code>, con sesión. Recibe <code>{\"refreshToken\":\"…\"}<\/code> y responde un token de acceso y un refresh nuevos con su vigencia; si el refresh ya no sirve, responde 401. El realm fija el token de acceso en una vigencia corta (de 5 a 15 minutos).<\/p>\n<p>Cómo se sabe que está lista:\n- Tras una hora sin actividad, ve el aviso durante 10 segundos y puede seguir conectada o cerrar.\n- Al terminar el aviso, la sesión se cierra y vuelve al ingreso.\n- «Cerrar sesión» borra los datos de sesión del navegador, avisa al servidor para liberar la sesión y lleva al ingreso.\n- Con el botón «Atrás» después de salir, no se ve ninguna página privada.\n- Con actividad, la sesión sigue abierta más de 15 minutos; sin actividad una hora, aparece el aviso.\n- Si el token vence y no se puede renovar, la interfaz cierra la sesión del navegador y lleva al ingreso.<\/p>\n<p>Cubre: aviso y cierre por inactividad (FR007), cierre de sesión (FR015). Depende de: H-2.2.<\/p>\n<h4>H-2.4 Restaurar y definir contraseña<\/h4>\n<p>Es el recorrido para pedir un enlace por correo y definir una contraseña nueva. Sirve para recuperar el acceso sin ayuda del administrador.<\/p>\n<p>Como persona que olvidó su contraseña, quiero recibir un enlace por correo y definir una nueva, para volver a ingresar.<\/p>\n<p>De dónde sale: PRD («Acceso y cuenta»), UX («Restaurar contraseña», «Definir contraseña»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#restaurar\">Restaurar<\/a>, <a href=\"../ux/prototipo.html#restaurar-error\">datos que no coinciden<\/a>, <a href=\"../ux/prototipo.html#restaurar-enviado\">revise su correo<\/a>, <a href=\"../ux/prototipo.html#definir-clave\">definir contraseña<\/a>, <a href=\"../ux/prototipo.html#definir-clave-error\">con errores<\/a>, <a href=\"../ux/prototipo.html#enlace-vencido\">enlace vencido<\/a> y <a href=\"../ux/prototipo.html#clave-guardada\">contraseña guardada<\/a>.<\/p>\n<p>Servicios: <code>POST /api/acceso/restaurar<\/code> y <code>POST /api/acceso/contrasena<\/code>, ambos públicos; el segundo recibe el token del enlace.<\/p>\n<p>Cómo se sabe que está lista:\n- Si usuario y correo no coinciden, ve el error y no sale ningún correo.\n- El enlace sirve una vez y vence a las 24 horas; usado o vencido, ofrece pedir uno nuevo.\n- «Guardar» se habilita solo con datos válidos; si no coinciden, ve «La confirmación no es el mismo dato ingresado».\n- El servidor rechaza una contraseña como «abc123» aunque la petición no pase por la pantalla.\n- Al definir la contraseña por primera vez, el usuario pasa de Creado a activo.\n- El enlace de un correo real de prueba abre «Definir contraseña» con la ruta nueva.<\/p>\n<p>Cubre: correo de restauración (FR008), enlace de un solo uso (FR009), definir contraseña (FR010), política validada en el servidor (FR011), usuario creado pasa a activo (FR019), enlaces de correo con rutas nuevas (UX-DR003). Depende de: H-2.1, H-1.6.<\/p>\n<h4>H-2.7 Menú lateral por rol y página sin permiso<\/h4>\n<p>Es el menú que muestra solo lo que el rol puede usar y la pantalla que aparece cuando no hay permiso. Sirve para que nadie vea opciones inútiles y que el rechazo se entienda.<\/p>\n<p>Como persona con un rol, quiero ver solo mis opciones y saber cuál pantalla estoy usando, para no perderme.<\/p>\n<p>De dónde sale: PRD («Acceso y cuenta»), UX («Sin permiso para esta página»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#sin-permiso\">Ver la pantalla<\/a>.<\/p>\n<p>Cómo se sabe que está lista:\n- El perfil que llega al ingresar trae el menú de <code>rol_menu<\/code>; un usuario sin acceso a «Reportes» no ve esa opción.\n- El menú se despliega y contrae por categoría, marca la pantalla actual y se cierra al elegir una opción.\n- Las guardas de ruta de Angular llevan a «Sin permiso» cuando el permiso falta; la API decide siempre.\n- Hay un menú por cada uno de los seis perfiles del prototipo (los 16 roles llegan en H-3.3).<\/p>\n<p>Cubre: menú por rol (FR013), menú que marca la pantalla actual (UX-DR013). Depende de: H-2.1.<\/p>", "spec_html": "<h3>Sesión única y bloqueo<\/h3>\n<ul>\n<li>Migración <code>V2_04__sesion_y_bloqueo.sql<\/code>, después de <code>V2_03<\/code> (D15). Crea las dos tablas siguientes.<\/li>\n<li>Tabla <code>acceso_cuenta<\/code>: cuenta los intentos fallidos y marca el bloqueo. El máximo es 5, en el parámetro <code>hema.acceso.max-intentos<\/code>. Una cuenta bloqueada responde 423 aun con la clave correcta, deja <code>CUENTA_BLOQUEADA<\/code> en la bitácora y envía el correo de recuperación (FR004).<\/li>\n<li>Tabla <code>sesion_activa<\/code>: una fila por usuario, identificada por el <code>sid<\/code> del token (si falta, el <code>jti<\/code>). Si ya hay una vigente, el ingreso responde 409 y no cuenta como intento fallido (FR005).<\/li>\n<li>Latido: la interfaz manda <code>POST /api/acceso/latido<\/code> cada 5 minutos con sesión. Una tarea Quartz cada minuto libera las sesiones con más de 15 minutos sin latido. La sesión también se libera al cerrar y cuando el aviso de una hora de inactividad cierra la sesión (FR005 a FR007).<\/li>\n<li>El usuario y la sesión del latido y del cierre (<code>/api/acceso/cierre<\/code>) salen del token, no del cuerpo (FR031).<\/li>\n<li>Valores del realm (TK-3, TK-4): <code>accessTokenLifespan<\/code> 600 s, <code>ssoSessionIdleTimeout<\/code> 1800 s, <code>ssoSessionMaxLifespan<\/code> 36000 s (tope de 10 horas), <code>revokeRefreshToken<\/code> en true y <code>refreshTokenMaxReuse<\/code> en 0 (el refresh sirve una sola vez).<\/li>\n<li>Renovación (TK-3, TK-4): <code>POST /api/acceso/renovar<\/code> recibe el refresh token, lo cambia en Keycloak por un par nuevo y responde el token de acceso y el refresh token nuevos. Cada renovación conserva el <code>sid<\/code>, así la fila de <code>sesion_activa<\/code> sigue siendo la misma. El servidor responde 401, sin detalle, si Keycloak rechaza el refresh (<code>invalid_grant<\/code>) o si el token renovado no trae el mismo <code>sid<\/code>. Responde 503 si Keycloak falla o está mal configurado.<\/li>\n<li>La interfaz renueva 60 segundos antes de que venza el token, con o sin actividad. Si recibe 503, reintenta cada 15 segundos mientras el token siga vivo; si recibe 401 o el token vence, cierra la sesión del navegador. Cuando el navegador no logra avisar, la tarea Quartz libera la fila a los 15 minutos sin latido.<\/li>\n<li>Dónde se guarda el refresh token (TK-4): en <code>sessionStorage<\/code>, junto al token de acceso. Se borra al cerrar la sesión o la pestaña. En memoria, recargar la página cortaba la renovación, la sesión moría a los 10 minutos y la sesión única retenía la fila hasta 15 minutos sin latido, así que la persona no podía volver a entrar (409). El costo es que una falla de XSS puede leerlo (ver «Riesgo del refresh token»).<\/li>\n<\/ul>\n<h3>Permisos y menús<\/h3>\n<ul>\n<li>Tablas: <code>rol<\/code> (<code>V3_03<\/code>, H-3.3: <code>codigo<\/code> con prefijo <code>campus:<\/code>, <code>nombre<\/code> y <code>orden<\/code>, con los 16 roles), <code>permiso<\/code>, <code>rol_permiso<\/code> y <code>rol_menu<\/code> (D11). El perfil que recibe la interfaz al ingresar trae sus permisos y su menú.<\/li>\n<li>Los 16 nombres de rol son un supuesto tomado de <code>docs/levantamiento.md<\/code> y del prototipo, pendiente de P-32. Si ATENEA da otra lista, se corrige en <code>V3_03<\/code> sin tocar código.<\/li>\n<li>El menú de cada rol usa solo categorías del catálogo del frontend (TK-6). <code>GET /api/roles-menu<\/code> (permiso <code>roles:listar<\/code>) devuelve los roles con su menú.<\/li>\n<li>Las guardas de ruta de Angular usan los mismos permisos, solo para no mostrar lo que no se puede usar. La API decide siempre.<\/li>\n<li>Lista de usuarios (TK-7, H-3.1): el estado se calcula, no se guarda. Es Inactivo si <code>activo<\/code> es 0, Creado si <code>usuario_estado<\/code> dice CREADO y, si no, Activo.<\/li>\n<li>\n<p>Permisos sembrados (H-3.3, TK-8): <code>usuarios:listar<\/code>, <code>cronograma:administrar<\/code> y <code>roles:listar<\/code> van a <code>campus:administrador<\/code> y <code>campus:administrador-campus<\/code>. <code>cuenta:cambiar-contrasena<\/code> va a los 16 roles. <code>usuarios:crear<\/code> y <code>usuarios:editar<\/code> van a los dos administradores en <code>V3_04<\/code> (H-3.2). <code>formularios:administrar<\/code> (<code>V4_02<\/code>) va a <code>campus:administrador<\/code> y <code>historicos:administrar<\/code> (<code>V4_03<\/code>) a <code>campus:administrador<\/code> y <code>campus:administrador-campus<\/code>. <code>usuarios:habilitar-integrador<\/code> (<code>V3_05<\/code>, H-3.4) va solo a <code>campus:administrador-campus<\/code>. <code>formularios:diligenciar<\/code> (H-6.1, TK-14) va solo a <code>campus:beneficiario<\/code>. <code>convocatorias:administrar<\/code> (<code>V7_01<\/code>, H-7.1, TK-16) va a <code>campus:administrador-campus<\/code> y <code>campus:lider-convocatoria<\/code>. <code>diagnostico:autoevaluar<\/code> (<code>V12_01<\/code>, H-12.1, TK-24) va a <code>campus:beneficiario<\/code> y <code>campus:arranque-prueba<\/code>. <code>gestores:asignar-entidades<\/code> (<code>V12_04<\/code>, H-3.6, TK-22) va a <code>campus:administrador-campus<\/code> y, como rol de prueba, a <code>campus:arranque-prueba<\/code>. <code>diagnostico:oficial<\/code> (<code>V12_02<\/code>, H-12.2, TK-26) va solo a <code>campus:gestor-gma<\/code>. <code>formularios:consultar-otras<\/code> (<code>V6_06<\/code>, H-6.6, TK-27) va a <code>campus:administrador<\/code>, <code>campus:administrador-internacionalizacion<\/code> y <code>campus:administrador-campus<\/code>, nunca a beneficiario ni integrador. Desde TK-10, un permiso que crea una migración posterior (como <code>cronograma:administrar<\/code>, creado en <code>V4_01<\/code>) se reparte a los roles en una migración posterior a la que lo crea (D15).<\/p>\n<\/li>\n<li>\n<p>Permisos de H-11.1 y H-8.3: <code>caracterizacion:enviar<\/code> va solo a <code>campus:beneficiario<\/code>, y <code>caracterizacion:validar<\/code> (<code>V11_02<\/code>) va solo a <code>campus:administrador-campus<\/code>. <code>postulacion:listar<\/code> (<code>V8_04<\/code>) va a los roles administrador-campus, líder de convocatoria, equipo habilitador y gerencia CTeI. Los códigos de esos roles son propuesta por confirmar con ATENEA.<\/p>\n<\/li>\n<li>Permisos de H-13.4 (<code>V13_05<\/code>, PR #63, por unirse): <code>hojas:ver<\/code> va a <code>campus:beneficiario<\/code>, <code>campus:integrador<\/code> y <code>campus:gestion-presupuestal<\/code>; <code>hojas:ver-todas<\/code> va solo a <code>campus:gestion-presupuestal<\/code>. Los roles salen de <code>V13_05<\/code>; se confirman con ATENEA junto con los demás de la serie.<\/li>\n<li>Permisos de H-14.1 (<code>V14_01<\/code>, PR #64, por unirse): <code>firmas:ver<\/code> va a <code>campus:beneficiario<\/code>, <code>campus:integrador<\/code>, <code>campus:gestion-presupuestal<\/code>, <code>campus:gestor-gma<\/code> y <code>campus:director-general<\/code>. <code>firmas:etapa-1<\/code> va a <code>campus:gestion-presupuestal<\/code>; <code>firmas:etapa-2<\/code> a <code>campus:beneficiario<\/code>; <code>firmas:etapa-3<\/code> a <code>campus:integrador<\/code> y <code>campus:gestor-gma<\/code>; <code>firmas:etapa-4<\/code> a <code>campus:director-general<\/code>. Son permisos añadidos a la ficha de H-14.1, que no los listaba; los roles salen de <code>V14_01<\/code> y el arquitecto los confirma junto con los demás de la serie.<\/li>\n<li>Permisos de H-14.5 y H-14.6 (<code>V14_04<\/code> y <code>V14_05<\/code>, por unirse): <code>firmas:ver-sin-precios<\/code> va solo a <code>campus:beneficiario<\/code>; <code>firmas:verificar<\/code> (<code>V14_05<\/code>, PR #70) va a <code>campus:beneficiario<\/code>, <code>campus:integrador<\/code>, <code>campus:gestion-presupuestal<\/code>, <code>campus:gestor-gma<\/code> y <code>campus:director-general<\/code>, los roles que ven la hoja; la ficha decía «persona autorizada» y el arquitecto lo confirma al unirla.<\/li>\n<li>Permiso de H-10.1 (PR #73, por unirse): <code>formalizacion:cargar<\/code> lo exigen <code>GET<\/code> y <code>POST /api/formalizacion/carta<\/code>. Los roles y la migración que lo crea se confirman en el PR.<\/li>\n<li>Permiso de H-10.2 (PR #77, por unirse): <code>formalizacion:revisar<\/code> va solo a <code>campus:administrador-campus<\/code> y lo exigen los endpoints de revisión de la carta.<\/li>\n<li>Permiso de la consulta de bitácora (<code>V16_01<\/code>, H-16.2): <code>bitacora:consultar<\/code> va solo a <code>campus:gerencia-ctei<\/code> y <code>campus:administrador<\/code>. Los demás roles reciben 403 en <code>GET /api/bitacora<\/code>.<\/li>\n<li>Permisos de H-15.1 (<code>V15_01<\/code>, PR #75, por unirse): <code>planes:proponer<\/code> va solo a <code>campus:integrador<\/code> y <code>planes:aprobar<\/code> solo a <code>campus:gestor-gma<\/code>. Los códigos de rol salen de <code>V15_01<\/code>.<\/li>\n<li>Permisos de H-15.2 (<code>V15_02<\/code>, PR #76, por unirse): <code>hitos:reportar<\/code> va a <code>campus:integrador<\/code> y <code>hitos:validar<\/code> a <code>campus:gestor-gma<\/code>.<\/li>\n<li>Permisos de H-15.3 (<code>V15_03<\/code>, PR #78, por unirse): <code>servicios:conformar<\/code> va solo a <code>campus:beneficiario<\/code> y <code>servicios:cerrar<\/code> solo a <code>campus:gestor-gma<\/code>. El GET de estado acepta cualquiera de los dos.<\/li>\n<li>Permisos de H-15.4 (<code>V15_04<\/code>, PR #83, por unirse): <code>seguimiento:consultar<\/code>, <code>seguimiento:consultar-todos<\/code> (solo <code>campus:administrador-campus<\/code>) y <code>seguimiento:consultar-asignados<\/code> (solo <code>campus:gestor-gma<\/code>). El rol que recibe <code>seguimiento:consultar<\/code> se confirma con <code>V15_04<\/code>, que no está en main.<\/li>\n<li>Permiso de H-9.5 (PR #56, por unirse): <code>panel:administrar<\/code> va solo a <code>campus:panel-asignacion<\/code> y <code>campus:arranque-prueba<\/code>. Lo exigen los cuatro endpoints del panel.<\/li>\n<li>Permiso de H-9.6 (<code>V9_04<\/code>, PR #58, revisado y en unión): <code>ranking:consultar<\/code> va solo a <code>campus:comite-evaluador<\/code> y <code>campus:arranque-prueba<\/code>. La migración <code>V9_04<\/code> solo da ese permiso; no crea tablas.<\/li>\n<li>Permiso de H-9.3 (<code>V9_08<\/code>, PR #60, por unirse): <code>sarlaft:revisar<\/code> va solo a <code>campus:enlace-sarlaft<\/code> y <code>campus:arranque-prueba<\/code>. Lo exigen los dos endpoints de SARLAFT.<\/li>\n<li>Permiso de H-16.4 (<code>V16_04<\/code>, PR #62, unido): <code>sarlaft:consultar<\/code> va a <code>campus:gerencia-ctei<\/code>, <code>campus:enlace-sarlaft<\/code>, <code>campus:comite-evaluador<\/code> y <code>campus:arranque-prueba<\/code>. Lo exige el campo <code>estadoSarlaft<\/code> de <code>GET /api/postulaciones<\/code>; los demás roles reciben ese campo en null.<\/li>\n<li>Permiso de H-16.1 (<code>V16_03<\/code>, PR #80, por unirse): <code>inicio:ver<\/code> va a los 16 roles y lo exige <code>GET /api/inicio<\/code>.<\/li>\n<\/ul>"}, {"n": 2, "titulo": "Usuarios y roles", "roles": ["Administrador"], "prd": ["### Usuarios y roles"], "historias": ["H-3.1", "H-3.2", "H-3.3", "H-3.6"], "spec": ["### Permisos y menús"], "resumen": "El administrador busca, crea y edita usuarios, revisa qué ve cada uno de los 16 roles en el menú y asigna entidades a cada Gestor GMA.", "usuarios": "qa.administrador", "video": "videos/cap02.mp4", "vtt": "WEBVTT\n\n1\n00:00:03.100 --> 00:00:05.171\nCapítulo dos.\n\n2\n00:00:05.121 --> 00:00:09.276\nUsuarios y roles, la tarea del administrador.\n\n3\n00:00:09.886 --> 00:00:14.132\nEl administrador entra a Hēma y abre la opción Usuarios.\n\n4\n00:00:14.704 --> 00:00:21.359\nLa lista muestra usuario, documento, correo, entidad y estado de cada persona.\n\n5\n00:00:21.922 --> 00:00:27.848\nCon el buscador encuentra a alguien por nombre, documento, correo o entidad.\n\n6\n00:00:28.420 --> 00:00:35.909\nCon Nuevo usuario se crea una cuenta: se indica el rol y, si aplica, la entidad a la que pertenece.\n\n7\n00:00:36.478 --> 00:00:43.875\nEditar permite cambiar los datos o el rol de una persona que ya existe, o desactivarla sin borrar su historia.\n\n8\n00:00:44.440 --> 00:00:50.796\nEn Roles y menús se ve qué categorías del menú tiene cada uno de los dieciséis roles de Campus.\n\n9\n00:00:51.346 --> 00:01:01.999\nAsí, por ejemplo, el comité evaluador solo ve evaluación, y el beneficiario ve su postulación, diagnóstico, hojas de ruta y firmas.\n\n10\n00:01:02.572 --> 00:01:10.256\nAdemás, a cada gestor GMA se le asignan las entidades que acompaña, y solo ve la información de esas entidades.\n\n", "prd_html": "<h3>Usuarios y roles<\/h3>\n<ul>\n<li>FR017. El administrador consulta usuarios con nombre de usuario, documento, correo, entidad, entidad padre, estado y secciones; busca por texto y pagina. Sin coincidencias muestra «Información no se encuentra con el dato».\n  Criterio: dado el texto «admin», cuando busca, entonces solo ve las filas que lo contienen. (RF-09)<\/li>\n<li>FR018. El administrador crea usuarios con correo (formato válido), nombre de usuario, entidad y rol, todos obligatorios; «Guardar» se habilita solo con datos válidos.\n  Criterio: dado datos completos, cuando guarda, entonces el usuario aparece en el listado. (RF-10)<\/li>\n<li>FR019. Al crear un usuario, el sistema lo deja en estado «Creado» y le envía el enlace para definir su contraseña.\n  Criterio: dado un usuario recién creado, cuando define su contraseña, entonces su estado pasa a activo. (RF-10)<\/li>\n<li>FR020. El administrador edita entidad (selector con búsqueda), correo y nombre de usuario, con «Cancelar» que descarta los cambios.\n  Criterio: dado la ventana de edición abierta, cuando pulsa «Cancelar», entonces nada se guarda. (RF-11)<\/li>\n<li>FR021. El administrador activa o inactiva una cuenta; un usuario inactivo no puede ingresar.\n  Criterio: dado un usuario inactivo, cuando intenta ingresar, entonces se rechaza. (RF-11)<\/li>\n<li>FR022. El administrador asigna una contraseña a otro usuario con contraseña y confirmación; los campos aparecen solo al activar «Cambiar contraseña» y aplican FR011.\n  Criterio: dado una contraseña sin carácter especial, cuando guarda, entonces ve «La contraseña debe contener al menos una mayúscula, un número y un carácter especial». (RF-12)<\/li>\n<li>FR023. Cualquier persona puede registrarse como beneficiario (entidad jurídica o persona natural); el sistema le asigna siempre el rol Beneficiario.\n  Criterio: dado un registro que trae otro rol en la petición, cuando se envía, entonces el servidor lo ignora y asigna Beneficiario. (R-41; P-43)<\/li>\n<li>FR024. El Administrador Campus crea usuarios internos y habilita a los usuarios de Ceiba y Connect.\n  Criterio: dado un usuario de integrador sin habilitar, cuando el Administrador Campus lo habilita, entonces puede ingresar. (R-41)<\/li>\n<li>FR025. El sistema maneja los 16 roles de la matriz de ATENEA, más los roles que el código ya usa, y cada rol define qué módulos y acciones tiene. La relación de la matriz con los 6 roles actuales se define en P-32 (SUP15).\n  Criterio: dado cada rol de la matriz, cuando ingresa, entonces solo ve sus opciones. (R-35; XL2 P-21, P-32)<\/li>\n<li>FR123. El Administrador Campus asigna y retira entidades beneficiarias a cada Gestor GMA. El Gestor solo ve y abre el diagnóstico y las hojas de ruta de las entidades que tiene asignadas; sin asignación, el servidor responde «prohibido». Cada asignación y cada retiro queda en la bitácora (FR121). Complementa FR030. La pantalla de asignación se resuelve con un boceto del plan, no con el prototipo.\n  Criterio: dado la entidad A asignada al Gestor 1, cuando el Gestor 2 abre la entidad A, entonces recibe 403.\n  Criterio: dado un Gestor sin entidades asignadas, cuando consulta sus entidades, entonces la lista sale vacía.\n  Criterio: dado el Administrador Campus que retira la entidad A al Gestor 1, cuando el Gestor 1 la abre, entonces recibe 403, y la bitácora trae la asignación y el retiro con los cinco datos de FR121. (TK-22; R-35, R-19)<\/li>\n<\/ul>", "historia_html": "<h4>H-3.1 Listar y buscar usuarios<\/h4>\n<p>Es la lista de usuarios con búsqueda y paginación. Sirve para que el administrador encuentre cuentas rápido.<\/p>\n<p>Como administrador, quiero buscar y paginar usuarios, para gestionarlos.<\/p>\n<p>De dónde sale: PRD («Usuarios y roles»), UX («Usuarios»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#usuarios\">Ver la pantalla<\/a> y <a href=\"../ux/prototipo.html#usuarios-vacia\">sin resultados<\/a>.<\/p>\n<p>Servicio: <code>GET /api/usuarios?texto=&amp;pagina=<\/code>, permiso <code>usuarios:listar<\/code>.<\/p>\n<p>Cómo se sabe que está lista:\n- Ve usuario, documento, correo, entidad, entidad padre, estado y secciones.\n- Buscar «admin» deja solo las filas que lo contienen; sin coincidencias ve «Información no se encuentra con el dato».\n- Un usuario de entidad que pide la lista recibe «prohibido» (403).\n- El selector de usuarios de otras pantallas recibe solo los datos que muestra.<\/p>\n<p>Cubre: consultar usuarios (FR017), la lista solo para roles con acceso (FR029). Depende de: H-2.7.<\/p>\n<h4>H-3.2 Crear y editar usuarios<\/h4>\n<p>Es el alta y la edición de usuarios por el administrador. Sirve para tener cuentas internas y corregir datos.<\/p>\n<p>Como administrador, quiero crear y editar usuarios, para dar acceso a quien corresponde.<\/p>\n<p>De dónde sale: PRD («Usuarios y roles»), UX («Usuarios»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#usuarios-crear\">Nuevo usuario<\/a>, <a href=\"../ux/prototipo.html#usuarios-editar\">editar<\/a> y <a href=\"../ux/prototipo.html#usuarios-editar-error\">contraseña no válida<\/a>.<\/p>\n<p>Servicios: <code>POST /api/usuarios<\/code>, <code>PUT /api/usuarios/{id}<\/code> y <code>PUT /api/usuarios/{id}/contrasena<\/code>, con permisos <code>usuarios:crear<\/code> y <code>usuarios:editar<\/code>.<\/p>\n<p>Cómo se sabe que está lista:\n- Crear exige correo válido, nombre de usuario, entidad y rol; «Guardar» se habilita solo con todo completo; el usuario queda en Creado y recibe el enlace.\n- Editar permite cambiar entidad (con búsqueda), correo y nombre; «Cancelar» descarta los cambios.\n- Un usuario inactivo no puede ingresar.\n- Los campos de contraseña aparecen solo al activar «Cambiar contraseña» y aplican la política, con sus dos mensajes.\n- Un usuario común que intenta cambiar el correo o la contraseña de otro recibe «prohibido».\n- Al renombrar un usuario, su bloqueo por intentos, su sesión abierta y sus enlaces de contraseña pendientes pasan al nombre nuevo: un enlace pendiente sigue sirviendo y una cuenta bloqueada sigue bloqueada.\n- Al inactivar un usuario, su sesión abierta se libera.\n- Si la base falla después de que Keycloak ya cambió, el cambio se deshace en Keycloak; si tampoco se puede deshacer, el administrador ve un aviso de que el usuario quedó a medias.\n- Una prueba por cada uno de esos tres casos.<\/p>\n<p>Cubre: crear usuario (FR018), estado Creado y enlace (FR019), editar (FR020), activar o inactivar (FR021), asignar contraseña a otro (FR022), cada usuario cambia solo lo suyo (FR027), sesión única y enlace de un solo uso que no se pierden al renombrar (FR005, FR009). Depende de: H-3.1, H-2.4.<\/p>\n<h4>H-3.3 Los 16 roles, sus permisos y sus menús<\/h4>\n<p>Es la carga de los 16 roles de la matriz de ATENEA con sus permisos y la pantalla que muestra qué ve cada rol. Sirve para que cada rol vea solo sus módulos.<\/p>\n<p>Como administrador, quiero ver qué menús tiene cada rol, para comprobar que nadie ve de más.<\/p>\n<p>De dónde sale: PRD («Usuarios y roles»), UX («Roles y menús»), decisión 0006.<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#roles-menu\">Ver la pantalla<\/a>.<\/p>\n<p>Datos: un script Flyway que carga los 16 roles de la matriz más los que el código ya usa, sus filas de <code>rol_permiso<\/code> y <code>rol_menu<\/code>. La relación con los seis menús es un supuesto (P-32) y se corrige en la tabla, sin tocar código.<\/p>\n<p>Cómo se sabe que está lista:\n- Cada rol ingresa y ve solo las categorías de su menú.\n- El CSV de la matriz tiene una fila por cada rol y cada servicio existente, y la prueba pasa.\n- Los roles de Campus se crean nuevos y solo se homologan donde calcen (por ejemplo, ciudadano).<\/p>\n<p>Cubre: los 16 roles de la matriz (FR025), verificación en el servidor por rol (FR032), pruebas por rol y servicio (NFR001). Depende de: H-2.7.<\/p>\n<h4>H-3.6 Asignar entidades a cada Gestor GMA<\/h4>\n<p>Es la pantalla con la que el Administrador Campus elige un Gestor GMA y le asigna o le retira entidades beneficiarias. Sirve para que cada Gestor abra solo el diagnóstico y las hojas de ruta de sus entidades.<\/p>\n<p>Como Administrador Campus, quiero asignar entidades a cada Gestor GMA, para que cada uno vea solo lo suyo.<\/p>\n<p>De dónde sale: PRD (FR123), arquitectura (D17), TK-22. Es una de las ocho funciones sin pantalla en UX.<\/p>\n<p>Diseño: <a href=\"pasos.html#h-3-6\">Ver el paso<\/a>.<\/p>\n<p>Servicios, con el permiso <code>gestores:asignar-entidades<\/code> (solo Administrador Campus): <code>GET /api/gestores/{gestor}/entidades<\/code>, <code>PUT /api/gestores/{gestor}/entidades/{entidad}<\/code> y <code>DELETE /api/gestores/{gestor}/entidades/{entidad}<\/code>. Un solo servicio, <code>AsignacionDeGestores<\/code>, consulta las asignaciones para H-12.2 y H-13.1.<\/p>\n<p>Cómo se sabe que está lista:\n- Elige un Gestor GMA, ve sus entidades con quién y cuándo las asignó, agrega una y retira otra; retirar pide confirmación.\n- Solo el Administrador Campus ve la pantalla; cualquier otro rol recibe «prohibido» (403).\n- Asignar de nuevo una entidad ya asignada no repite nada ni deja otro registro; retirar una que no estaba asignada responde 404.\n- Cada asignación y cada retiro queda en la bitácora (<code>GESTOR_ENTIDAD_ASIGNADA<\/code> y <code>GESTOR_ENTIDAD_RETIRADA<\/code>).\n- Con la entidad A asignada al Gestor 1, el Gestor 2 que abre la entidad A recibe 403; un Gestor sin entidades ve la lista vacía.\n- La tabla <code>gestor_entidad<\/code> definitiva reemplaza la provisional que T-12.2.1 creó en H-12.2, sin cambiar el servicio de consulta.<\/p>\n<p>Cubre: asignación de entidades a cada Gestor GMA (FR123), pruebas de seguridad (NFR012). Depende de: H-3.2, H-3.3.<\/p>", "spec_html": "<h3>Permisos y menús<\/h3>\n<ul>\n<li>Tablas: <code>rol<\/code> (<code>V3_03<\/code>, H-3.3: <code>codigo<\/code> con prefijo <code>campus:<\/code>, <code>nombre<\/code> y <code>orden<\/code>, con los 16 roles), <code>permiso<\/code>, <code>rol_permiso<\/code> y <code>rol_menu<\/code> (D11). El perfil que recibe la interfaz al ingresar trae sus permisos y su menú.<\/li>\n<li>Los 16 nombres de rol son un supuesto tomado de <code>docs/levantamiento.md<\/code> y del prototipo, pendiente de P-32. Si ATENEA da otra lista, se corrige en <code>V3_03<\/code> sin tocar código.<\/li>\n<li>El menú de cada rol usa solo categorías del catálogo del frontend (TK-6). <code>GET /api/roles-menu<\/code> (permiso <code>roles:listar<\/code>) devuelve los roles con su menú.<\/li>\n<li>Las guardas de ruta de Angular usan los mismos permisos, solo para no mostrar lo que no se puede usar. La API decide siempre.<\/li>\n<li>Lista de usuarios (TK-7, H-3.1): el estado se calcula, no se guarda. Es Inactivo si <code>activo<\/code> es 0, Creado si <code>usuario_estado<\/code> dice CREADO y, si no, Activo.<\/li>\n<li>\n<p>Permisos sembrados (H-3.3, TK-8): <code>usuarios:listar<\/code>, <code>cronograma:administrar<\/code> y <code>roles:listar<\/code> van a <code>campus:administrador<\/code> y <code>campus:administrador-campus<\/code>. <code>cuenta:cambiar-contrasena<\/code> va a los 16 roles. <code>usuarios:crear<\/code> y <code>usuarios:editar<\/code> van a los dos administradores en <code>V3_04<\/code> (H-3.2). <code>formularios:administrar<\/code> (<code>V4_02<\/code>) va a <code>campus:administrador<\/code> y <code>historicos:administrar<\/code> (<code>V4_03<\/code>) a <code>campus:administrador<\/code> y <code>campus:administrador-campus<\/code>. <code>usuarios:habilitar-integrador<\/code> (<code>V3_05<\/code>, H-3.4) va solo a <code>campus:administrador-campus<\/code>. <code>formularios:diligenciar<\/code> (H-6.1, TK-14) va solo a <code>campus:beneficiario<\/code>. <code>convocatorias:administrar<\/code> (<code>V7_01<\/code>, H-7.1, TK-16) va a <code>campus:administrador-campus<\/code> y <code>campus:lider-convocatoria<\/code>. <code>diagnostico:autoevaluar<\/code> (<code>V12_01<\/code>, H-12.1, TK-24) va a <code>campus:beneficiario<\/code> y <code>campus:arranque-prueba<\/code>. <code>gestores:asignar-entidades<\/code> (<code>V12_04<\/code>, H-3.6, TK-22) va a <code>campus:administrador-campus<\/code> y, como rol de prueba, a <code>campus:arranque-prueba<\/code>. <code>diagnostico:oficial<\/code> (<code>V12_02<\/code>, H-12.2, TK-26) va solo a <code>campus:gestor-gma<\/code>. <code>formularios:consultar-otras<\/code> (<code>V6_06<\/code>, H-6.6, TK-27) va a <code>campus:administrador<\/code>, <code>campus:administrador-internacionalizacion<\/code> y <code>campus:administrador-campus<\/code>, nunca a beneficiario ni integrador. Desde TK-10, un permiso que crea una migración posterior (como <code>cronograma:administrar<\/code>, creado en <code>V4_01<\/code>) se reparte a los roles en una migración posterior a la que lo crea (D15).<\/p>\n<\/li>\n<li>\n<p>Permisos de H-11.1 y H-8.3: <code>caracterizacion:enviar<\/code> va solo a <code>campus:beneficiario<\/code>, y <code>caracterizacion:validar<\/code> (<code>V11_02<\/code>) va solo a <code>campus:administrador-campus<\/code>. <code>postulacion:listar<\/code> (<code>V8_04<\/code>) va a los roles administrador-campus, líder de convocatoria, equipo habilitador y gerencia CTeI. Los códigos de esos roles son propuesta por confirmar con ATENEA.<\/p>\n<\/li>\n<li>Permisos de H-13.4 (<code>V13_05<\/code>, PR #63, por unirse): <code>hojas:ver<\/code> va a <code>campus:beneficiario<\/code>, <code>campus:integrador<\/code> y <code>campus:gestion-presupuestal<\/code>; <code>hojas:ver-todas<\/code> va solo a <code>campus:gestion-presupuestal<\/code>. Los roles salen de <code>V13_05<\/code>; se confirman con ATENEA junto con los demás de la serie.<\/li>\n<li>Permisos de H-14.1 (<code>V14_01<\/code>, PR #64, por unirse): <code>firmas:ver<\/code> va a <code>campus:beneficiario<\/code>, <code>campus:integrador<\/code>, <code>campus:gestion-presupuestal<\/code>, <code>campus:gestor-gma<\/code> y <code>campus:director-general<\/code>. <code>firmas:etapa-1<\/code> va a <code>campus:gestion-presupuestal<\/code>; <code>firmas:etapa-2<\/code> a <code>campus:beneficiario<\/code>; <code>firmas:etapa-3<\/code> a <code>campus:integrador<\/code> y <code>campus:gestor-gma<\/code>; <code>firmas:etapa-4<\/code> a <code>campus:director-general<\/code>. Son permisos añadidos a la ficha de H-14.1, que no los listaba; los roles salen de <code>V14_01<\/code> y el arquitecto los confirma junto con los demás de la serie.<\/li>\n<li>Permisos de H-14.5 y H-14.6 (<code>V14_04<\/code> y <code>V14_05<\/code>, por unirse): <code>firmas:ver-sin-precios<\/code> va solo a <code>campus:beneficiario<\/code>; <code>firmas:verificar<\/code> (<code>V14_05<\/code>, PR #70) va a <code>campus:beneficiario<\/code>, <code>campus:integrador<\/code>, <code>campus:gestion-presupuestal<\/code>, <code>campus:gestor-gma<\/code> y <code>campus:director-general<\/code>, los roles que ven la hoja; la ficha decía «persona autorizada» y el arquitecto lo confirma al unirla.<\/li>\n<li>Permiso de H-10.1 (PR #73, por unirse): <code>formalizacion:cargar<\/code> lo exigen <code>GET<\/code> y <code>POST /api/formalizacion/carta<\/code>. Los roles y la migración que lo crea se confirman en el PR.<\/li>\n<li>Permiso de H-10.2 (PR #77, por unirse): <code>formalizacion:revisar<\/code> va solo a <code>campus:administrador-campus<\/code> y lo exigen los endpoints de revisión de la carta.<\/li>\n<li>Permiso de la consulta de bitácora (<code>V16_01<\/code>, H-16.2): <code>bitacora:consultar<\/code> va solo a <code>campus:gerencia-ctei<\/code> y <code>campus:administrador<\/code>. Los demás roles reciben 403 en <code>GET /api/bitacora<\/code>.<\/li>\n<li>Permisos de H-15.1 (<code>V15_01<\/code>, PR #75, por unirse): <code>planes:proponer<\/code> va solo a <code>campus:integrador<\/code> y <code>planes:aprobar<\/code> solo a <code>campus:gestor-gma<\/code>. Los códigos de rol salen de <code>V15_01<\/code>.<\/li>\n<li>Permisos de H-15.2 (<code>V15_02<\/code>, PR #76, por unirse): <code>hitos:reportar<\/code> va a <code>campus:integrador<\/code> y <code>hitos:validar<\/code> a <code>campus:gestor-gma<\/code>.<\/li>\n<li>Permisos de H-15.3 (<code>V15_03<\/code>, PR #78, por unirse): <code>servicios:conformar<\/code> va solo a <code>campus:beneficiario<\/code> y <code>servicios:cerrar<\/code> solo a <code>campus:gestor-gma<\/code>. El GET de estado acepta cualquiera de los dos.<\/li>\n<li>Permisos de H-15.4 (<code>V15_04<\/code>, PR #83, por unirse): <code>seguimiento:consultar<\/code>, <code>seguimiento:consultar-todos<\/code> (solo <code>campus:administrador-campus<\/code>) y <code>seguimiento:consultar-asignados<\/code> (solo <code>campus:gestor-gma<\/code>). El rol que recibe <code>seguimiento:consultar<\/code> se confirma con <code>V15_04<\/code>, que no está en main.<\/li>\n<li>Permiso de H-9.5 (PR #56, por unirse): <code>panel:administrar<\/code> va solo a <code>campus:panel-asignacion<\/code> y <code>campus:arranque-prueba<\/code>. Lo exigen los cuatro endpoints del panel.<\/li>\n<li>Permiso de H-9.6 (<code>V9_04<\/code>, PR #58, revisado y en unión): <code>ranking:consultar<\/code> va solo a <code>campus:comite-evaluador<\/code> y <code>campus:arranque-prueba<\/code>. La migración <code>V9_04<\/code> solo da ese permiso; no crea tablas.<\/li>\n<li>Permiso de H-9.3 (<code>V9_08<\/code>, PR #60, por unirse): <code>sarlaft:revisar<\/code> va solo a <code>campus:enlace-sarlaft<\/code> y <code>campus:arranque-prueba<\/code>. Lo exigen los dos endpoints de SARLAFT.<\/li>\n<li>Permiso de H-16.4 (<code>V16_04<\/code>, PR #62, unido): <code>sarlaft:consultar<\/code> va a <code>campus:gerencia-ctei<\/code>, <code>campus:enlace-sarlaft<\/code>, <code>campus:comite-evaluador<\/code> y <code>campus:arranque-prueba<\/code>. Lo exige el campo <code>estadoSarlaft<\/code> de <code>GET /api/postulaciones<\/code>; los demás roles reciben ese campo en null.<\/li>\n<li>Permiso de H-16.1 (<code>V16_03<\/code>, PR #80, por unirse): <code>inicio:ver<\/code> va a los 16 roles y lo exige <code>GET /api/inicio<\/code>.<\/li>\n<\/ul>"}, {"n": 3, "titulo": "Inicio de cada perfil", "roles": ["Beneficiario", "Gestor", "Evaluador", "Director"], "prd": ["## Requisitos de experiencia"], "historias": ["H-16.1"], "spec": ["## Módulos"], "resumen": "Cada perfil entra a un inicio propio con lo que tiene pendiente: beneficiario, gestor, evaluador y director.", "usuarios": "qa.beneficiario, qa.gestor-gma, qa.comite-evaluador, qa.director-general", "video": "videos/cap03.mp4", "vtt": "WEBVTT\n\n1\n00:00:03.100 --> 00:00:05.107\nCapítulo tres.\n\n2\n00:00:05.057 --> 00:00:08.064\nLa pantalla de inicio de cada perfil.\n\n3\n00:00:08.662 --> 00:00:13.351\nCada persona, al entrar, ve primero lo que tiene pendiente.\n\n4\n00:00:13.301 --> 00:00:15.996\nEmpecemos con el beneficiario.\n\n5\n00:00:16.600 --> 00:00:23.724\nSu inicio le recuerda en qué va y le advierte, por ejemplo, que las hojas de ruta no le muestran precios.\n\n6\n00:00:24.274 --> 00:00:30.773\nAhora el gestor GMA, que acompaña a las entidades en su diagnóstico y sus hojas de ruta.\n\n7\n00:00:31.324 --> 00:00:38.578\nEl evaluador encuentra directamente el foco, el puntaje, el ranking y el informe de evaluación.\n\n8\n00:00:39.142 --> 00:00:44.782\nY el director general ve las hojas que esperan su firma y las versiones del catálogo.\n\n9\n00:00:45.352 --> 00:00:51.760\nCuando no hay nada por hacer, el inicio lo dice con claridad, para que nadie se quede buscando.\n\n", "prd_html": "<h2>Requisitos de experiencia<\/h2>\n<ul>\n<li>UX-DR001. Todas las pantallas, existentes y nuevas, se rediseñan con un único sistema de diseño; ninguna conserva el aspecto anterior. Criterio: Diego (PO) revisa cada pantalla contra el sistema de diseño. (R-50; CH23b)<\/li>\n<li>UX-DR002. El rediseño conserva las reglas que ve la persona: política de contraseña, sesión única, mensajes de error, validaciones, filtros y exportación a Excel (SUP14). Criterio: cada mensaje de SPEC aparece igual en la pantalla nueva. (P-41)<\/li>\n<li>UX-DR003. Las direcciones (rutas) pueden cambiar (SUP14). Criterio: el equipo entrega la tabla de rutas viejas y nuevas; los enlaces de los correos de contraseña funcionan con las nuevas. (P-41)<\/li>\n<li>UX-DR004. «Hema(v2).html» y «Diseño digital HR-EBCT» sirven de punto de partida visual, no de regla de negocio: el HR-EBCT difiere de ATENEA en el reparto 60/40, la administración del 20 % y la firma certificada (C-27 a C-34). Criterio: el diseño final no incluye reglas que ATENEA no confirmó.<\/li>\n<li>UX-DR005. Cada rol ve en una sola pantalla el estado de lo que le toca: postulación, hoja de ruta con su etapa de firma, plan e hitos. Criterio: dado un beneficiario en la etapa 3, cuando entra, entonces ve en qué etapa está y quién falta por firmar.<\/li>\n<li>UX-DR006. Cada listado y reporte tiene estado vacío, de carga y de error con mensaje. Criterio: sin datos, el listado muestra «Información no se encuentra con el dato» o su equivalente. (RF-09)<\/li>\n<li>UX-DR007. La interfaz cumple WCAG 2.1 nivel AA: contraste, uso con teclado y etiquetas en los campos (supuesto SUP20; P-41). Criterio: auditoría de accesibilidad sin hallazgos de nivel A o AA.<\/li>\n<li>UX-DR008. Textos en español de Colombia y fechas en dd/MM/aaaa. Criterio: ninguna pantalla muestra texto en otro idioma ni otro formato de fecha. (SPEC)<\/li>\n<li>UX-DR009. Cada pantalla funciona en portátil y tableta (supuesto SUP20; el uso en celular no está definido). Criterio: sin desplazamiento horizontal desde 768 px de ancho.<\/li>\n<li>UX-DR010. Antes de firmar o devolver una hoja, el sistema pide confirmar y muestra el efecto: una devolución reinicia las cuatro etapas. Criterio: dado una devolución, cuando la persona pulsa «Devolver», entonces ve el aviso del reinicio antes de confirmar. (R-30)<\/li>\n<\/ul>", "historia_html": "<h4>H-16.1 Pantalla de inicio de cada perfil<\/h4>\n<p>Es la página de inicio de cada perfil con el estado de lo que le toca. Sirve para que nadie busque qué tiene pendiente.<\/p>\n<p>Como persona con un rol, quiero ver en una pantalla qué me toca, para actuar sin buscar.<\/p>\n<p>De dónde sale: PRD (UX-DR005), UX («Inicio del administrador», «Mi estado», «Panel de Campus», «Mis beneficiarios», «Mis servicios»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#adm-inicio\">Administrador<\/a>, <a href=\"../ux/prototipo.html#ben-inicio\">beneficiario<\/a>, <a href=\"../ux/prototipo.html#cam-inicio\">Equipo ATENEA<\/a>, <a href=\"../ux/prototipo.html#ges-inicio\">Gestor GMA<\/a> e <a href=\"../ux/prototipo.html#int-inicio\">integrador<\/a>.<\/p>\n<p>Servicio: <code>GET /api/inicio<\/code>, que arma las tarjetas según el rol del token.<\/p>\n<p>Cómo se sabe que está lista:\n- Un beneficiario con la hoja en la etapa 3 entra y ve la etapa y quién falta por firmar, sin abrir otra pantalla.\n- Cada rol interno de ATENEA ve solo las tarjetas que le tocan.\n- El Gestor ve una fila por pendiente con enlace directo.\n- El beneficiario ve el aviso de que las hojas no muestran precios.<\/p>\n<p>Cubre: cada perfil ve el estado de lo que le toca (UX-DR005), menú y opciones por rol (FR013). Depende de: H-8.3, H-14.1, H-15.1.<\/p>", "spec_html": "<h2>Módulos<\/h2>\n<pre><code class=\"language-mermaid\">flowchart TD\n  acc[&quot;Acceso y roles&quot;] --&gt; conv[&quot;Convocatoria&quot;]\n  conv --&gt; post[&quot;Postulación, evaluación y formalización&quot;]\n  post --&gt; hoja[&quot;Diagnóstico y hoja de ruta&quot;]\n  cat[&quot;Catálogo&quot;] --&gt; hoja\n  hoja --&gt; firm[&quot;Firmas y sello&quot;]\n  firm --&gt; seg[&quot;Seguimiento&quot;]\n  tra[&quot;Bitácora, correo y archivos&quot;] -.-&gt; hoja\n<\/code><\/pre>\n<ul>\n<li>Bitácora, correo y archivos los usan todos los módulos. Un módulo no lee las tablas de otro: le pide el dato a su servicio (una prueba de arquitectura lo vigila). Cada módulo expone para eso un servicio de lectura, como <code>ConvocatoriaService.topeDe<\/code>, y los demás lo consumen (D20). Va detrás de un servicio propio (<code>RepositorioDeReglas<\/code>, <code>motor de reglas en<\/code> avalado por D19 y D02).<\/li>\n<li>Pantalla de inicio (H-16.1, PR #80, por unirse), en <code>transversal/inicio<\/code>. <code>GET /api/inicio<\/code> exige <code>inicio:ver<\/code>. Cada tarjeta la entrega un proveedor que implementa <code>ProveedorDeTarjetas<\/code>:<\/li>\n<li><code>HojasDelBeneficiarioProveedor<\/code> (<code>campus/hojaderuta<\/code>) exige <code>firmas:etapa-2<\/code> y usa <code>CircuitoDeFirmasService.hojasEnFirmaDe(entidad)<\/code>.<\/li>\n<li><code>FirmasPendientesProveedor<\/code> (<code>campus/hojaderuta<\/code>) exige <code>firmas:etapa-N<\/code> y enlaza a <code>/hojas-de-ruta/{id}/firmas<\/code>.<\/li>\n<li><code>PlanesPorAprobarProveedor<\/code> (<code>campus/seguimiento<\/code>) exige <code>planes:aprobar<\/code> y enlaza a <code>/plan-revision?servicio=N<\/code>.\n  Si el token no trae el permiso, el proveedor no entrega la tarjeta (D06). Los otros módulos se leen por sus servicios, no por sus tablas (D20).<\/li>\n<li>Convocatoria, roles y usuarios se escriben sin referencias a Campus para que BankPro los reutilice (NFR017).<\/li>\n<li>Reportes (H-5.1, TK-34, PR #42): el módulo transversal de reportes no lee tablas de Campus con <code>SELECT<\/code>. Cada módulo expone un servicio de lectura y el reporte lo consume, incluidos los reportes de H-5.3, H-5.4 y los que vienen después. El PR #42 se cambia a esa regla antes de unirse; hasta entonces sus lecturas directas no cuentan como aprobadas.<\/li>\n<li>Las siete funciones sin pantalla en UX (FR024, FR057, FR075, FR079, FR080, FR084, FR113) tienen servicio previsto en su módulo. Cuándo se les diseña pantalla lo decide el plan.<\/li>\n<li>Diligenciamiento (H-6.1, TK-14): <code>GET /api/formularios/{id}/diligenciamiento<\/code>, en <code>campus/formulario<\/code>. La entidad sale siempre del usuario del token (se busca en <code>usuario_perfil<\/code>) y nunca de la petición (D07).<\/li>\n<li>Validación de respuestas (H-6.2, TK-15, PR #23): <code>ValidadorDeRespuestas<\/code>, en <code>campus/formulario/service<\/code>. Aplica obligatoriedad, numérico, decimal, longitud, rango, expresión regular y número de opciones, con los mensajes de SPEC. Para el archivo exige el límite de 10 MB y los formatos de <code>transversal/archivos<\/code>. Aún no está conectado a ningún servicio: se conecta en H-6.4. Al conectarlo hay que limitar el costo de la expresión regular (ReDoS) y pasar el archivo por <code>ArchivoService<\/code>, para validar también los primeros bytes.<\/li>\n<li>Convocatorias (H-7.1, TK-16, PR #24): <code>ConvocatoriaService<\/code>, en <code>campus/convocatoria<\/code>. API: <code>GET /api/convocatorias<\/code>, <code>GET /api/convocatorias/{id}<\/code>, <code>GET /api/convocatorias/tipologias<\/code>, <code>POST /api/convocatorias<\/code> y <code>PUT /api/convocatorias/{id}<\/code>, todas con el permiso <code>convocatorias:administrar<\/code>. Crear y editar dejan registro en la bitácora (<code>CONVOCATORIA_CREADA<\/code> y <code>CONVOCATORIA_EDITADA<\/code>). <code>topeDe(convocatoria, tipologia)<\/code> entrega el tope que usará la hoja de ruta (H-13.3), para que ese módulo no lea las tablas de convocatoria.<\/li>\n<li>Diligenciamiento por sección (H-6.4, TK-18, PR #26): dos servicios en <code>campus/formulario<\/code>, ambos con el permiso <code>formularios:diligenciar<\/code> (solo <code>campus:beneficiario<\/code>). La entidad sale siempre del token, nunca de la petición (D07).<\/li>\n<li><code>GET /api/formularios/{id}/secciones/{numero}<\/code> devuelve las preguntas de la sección con lo ya guardado y la hora del último guardado, para poder volver otro día.<\/li>\n<li><code>PUT /api/formularios/{id}/respuestas<\/code> recibe <code>{seccion, respuestas: {codigo: valor}}<\/code> y guarda parcial: guarda lo válido, borra lo vacío y responde 200 con <code>{guardadoEn, errores: {codigo: mensaje}}<\/code>; lo inválido no se guarda, así un campo mal escrito no impide guardar el resto (FR053). No exige las obligatorias: se exigen al finalizar (H-6.5). Respeta el cierre del cronograma: con el plazo vencido responde 409 (<code>PlazoService.exigirAbierto<\/code>).<\/li>\n<li><code>GuardadoDeRespuestas<\/code> aplica esas reglas y <code>RepositorioDeRespuestas<\/code> es el único punto de acceso a las respuestas: ninguna otra clase lee ni escribe <code>formulario_respuesta<\/code>. Con eso el almacenamiento puede cambiar cuando Diego defina las preguntas.<\/li>\n<li>Bitácora: cada cambio por pregunta deja el evento <code>RESPUESTA_GUARDADA<\/code> en la bitácora existente, con valor anterior y nuevo escritos como «formulario N · sección M · código: valor». No hay tabla nueva: los códigos de pregunta solo son únicos dentro de una sección, y la bitácora ya guarda los dos valores.<\/li>\n<li>Interfaz: el panel de la sección monta <code>hm-pregunta<\/code> con las preguntas guardadas. TEXTO, NUMERO y FECHA se dibujan con su componente y OPCION como texto, porque <code>formulario_pregunta<\/code> no guarda las opciones. Guarda al salir del campo y cada 30 segundos.<\/li>\n<li>Finalización del formulario (H-6.5, TK-19, PR #27): <code>POST /api/formularios/{id}/finalizacion<\/code>, con el permiso <code>formularios:diligenciar<\/code> (solo <code>campus:beneficiario<\/code>), en la clase <code>FinalizacionDeFormulario<\/code> de <code>campus/formulario/service<\/code>. La entidad y el usuario salen del token (D07). Al finalizar aplica el motor de reglas (TK-21, PR #32), igual que al guardar; el guardado parcial usa los mismos datos (D09).<\/li>\n<li>Recibe <code>{aceptaTratamientoDeDatos}<\/code> y responde 200 con <code>{aceptadoEn, ip}<\/code>.<\/li>\n<li>422 con la lista de faltas (sección, nombre de sección, código, texto y mensaje) si hay obligatorias vacías o valores inválidos.<\/li>\n<li>422 sin faltas si no se aceptó el tratamiento de datos.<\/li>\n<li>409 si el formulario ya se envió, o si <code>PlazoService<\/code> dice que el plazo cerró.<\/li>\n<li>La interfaz no usa un endpoint de validación aparte: «Guardar y finalizar» guarda lo pendiente y finaliza con <code>aceptaTratamientoDeDatos=false<\/code>. Si no hay faltas, muestra el aviso de la Ley 1581 (datos conservados 10 años) y, al aceptar, repite con <code>true<\/code>. Así la validación queda solo en el servidor.<\/li>\n<li>Bloqueo: <code>GuardadoDeRespuestas<\/code> responde 409 (<code>FormularioFinalizadoException<\/code>) si la entidad ya finalizó ese formulario.<\/li>\n<li>Reglas de los formularios (H-6.3, TK-20, PR #28): <code>GET /api/formularios/{id}/reglas<\/code> entrega las reglas y la configuración de las preguntas de un formulario. Exige el permiso <code>formularios:diligenciar<\/code> y responde 404 si el formulario no existe. Aplica el motor en cada fase de diligenciamiento y de finalización (TK-21, PR #32), igual que al guardar; el guardado parcial usa los mismos datos (D09).<\/li>\n<li>Clases: <code>ReglasDeFormularioController<\/code> (controlador nuevo), <code>ReglasDeFormularioService<\/code> y <code>RepositorioDeReglas<\/code>, que lee las tablas de <code>V6_03<\/code>.<\/li>\n<li>Las reglas nombran las preguntas por código y las secciones por número. No hay reglas sembradas.<\/li>\n<li>Motor de reglas duplicado a propósito (H-6.3, TK-20): <code>MotorDeReglas<\/code> en el servidor (con <code>BigDecimal<\/code>) y <code>features/formularios/motor<\/code> en el frontend aplican la misma semántica. Un cambio en uno se hace también en el otro, con su prueba.<\/li>\n<li><code>HABILITA_*<\/code> oculta el destino hasta que la regla se cumple.<\/li>\n<li><code>DESHABILITA_PREGUNTA<\/code> y <code>DESHABILITA_SECCION<\/code> ocultan.<\/li>\n<li><code>DESHABILITA_POR_CONDICION<\/code> y <code>DESHABILITA_POR_SUMA_*<\/code> dejan el destino visible y deshabilitado. Si una pregunta queda oculta y deshabilitada a la vez, gana ocultar.<\/li>\n<li>Lo oculto no activa reglas ni suma.<\/li>\n<li>El cálculo se repite hasta que nada cambia, con un tope de vueltas.<\/li>\n<li>Los valores y sumatorias dependientes (<code>VALOR_DEPENDIENTE_*<\/code>, <code>SUMATORIA_DEPENDIENTE*<\/code>) solo devuelven violaciones, y solo si ambos lados tienen valor.<\/li>\n<li>En el panel, lo oculto no se dibuja, lo deshabilitado va en un <code>fieldset disabled<\/code> y las violaciones salen como error del campo.<\/li>\n<li>Límites conocidos (H-6.3, TK-20):<\/li>\n<li>El servidor aplica el motor al guardar y finalizar con los datos más recientes (TK-21, PR #32), incluidas las reglas que tocan varias secciones; el frontend espera las respuestas a que otro servicio las confirme. Queda un caso por pulir: cuando en la misma intentona se oculta una sección (una regla de la sección antes de guardar), conviene definir si repetir el motor o cerrar primero el lado que origina el ocultamiento.<\/li>\n<li>Ocultar una sección no oculta sus preguntas dentro del motor.<\/li>\n<li>Los códigos de pregunta solo son únicos dentro de una sección.<\/li>\n<li>El servidor no valida los límites de filas de matrices y ciclos.<\/li>\n<li>El panel todavía no dibuja matrices ni ciclos, porque <code>formulario_pregunta.tipo<\/code> solo admite TEXTO, NUMERO, FECHA y OPCION.<\/li>\n<li>Consulta de formularios entre entidades (H-6.6, TK-27, PR #35, <code>V6_06<\/code>, aún sin unir, en la rama h-6-6-consultar-el-formulario-de-otra): en <code>campus/formulario<\/code>. Es la única lectura de respuestas de otra entidad y la excepción a D07 para ese caso. Los dos permisos separan lo que cada rol ve.<\/li>\n<li><code>GET /api/formularios/{id}/respuestas?entidad=<\/code> con <code>formularios:consultar-otras<\/code> devuelve las respuestas de cualquier entidad, en solo lectura.<\/li>\n<li>Con <code>formularios:diligenciar<\/code> devuelve solo las de la propia entidad. Si el parámetro <code>entidad<\/code> no es la del token, responde 403.<\/li>\n<li><code>GET /api/formularios/consulta/usuarios<\/code> y <code>GET /api/formularios/consulta/formularios<\/code>, con <code>formularios:consultar-otras<\/code>, sirven para elegir la entidad y el formulario a consultar.<\/li>\n<li>El permiso <code>formularios:consultar-otras<\/code> lo asigna <code>V6_06<\/code> solo a <code>campus:administrador<\/code>, <code>campus:administrador-internacionalizacion<\/code> y <code>campus:administrador-campus<\/code>. Beneficiario e integrador no lo tienen.<\/li>\n<li>Interfaz: la sección del menú Formularios &gt; Consultar una entidad, con las rutas <code>/formularios/consultar<\/code> y <code>/formularios/:idFormulario/entidades/:idEntidad<\/code> (<code>docs/rutas.md<\/code>).<\/li>\n<li>Autodiagnóstico (H-12.1, TK-24): vive en <code>campus/hojaderuta<\/code>, porque no hay un módulo <code>diagnostico<\/code>. Exige el permiso <code>diagnostico:autoevaluar<\/code> (<code>campus:beneficiario<\/code>; el rol de prueba <code>campus:arranque-prueba<\/code> también lo trae).<\/li>\n<li><code>GET<\/code> y <code>PUT /api/diagnostico/autodiagnostico<\/code> devuelven <code>{dimensiones: [{codigo, nombre, calificacion}], guardadoEn}<\/code>. No hay campo de precio, así que no hay nada que ocultar. La entidad sale del token (D07).<\/li>\n<li>El <code>PUT<\/code> no exige las ocho dimensiones. Si una calificación no es un entero de 1 a 4, no guarda ninguna y responde 400: son ocho valores cerrados y el todo o nada es más simple que el guardado parcial de H-6.4.<\/li>\n<li>Cada cambio deja <code>AUTODIAGNOSTICO_GUARDADO<\/code> en la bitácora, escrito como «autodiagnóstico · Estrategia: 3». Si el valor no cambió, no escribe nada.<\/li>\n<li>No usa <code>PlazoService<\/code>: el autodiagnóstico no tiene cronograma.<\/li>\n<li>Las ocho dimensiones son el enum <code>Dimension<\/code>, no una tabla, porque son oficiales y fijas (FR095).<\/li>\n<li>Interfaz: ruta <code>/diagnostico/autodiagnostico<\/code>. Guarda al elegir, al salir del campo y cada 30 segundos. Quedaron fuera el botón «Enviar autodiagnóstico» del prototipo y la entrada al menú del beneficiario; los cubre TK-23.<\/li>\n<li>Envío del autodiagnóstico (TK-23, FR124, por construir, unas 3 h dentro de H-12.1):<\/li>\n<li><code>POST /api/diagnostico/autodiagnostico/envio<\/code>, con el permiso <code>diagnostico:autoevaluar<\/code>. La entidad y el usuario salen del token. Responde 200 con <code>{enviadoEn}<\/code>.<\/li>\n<li>Exige las ocho dimensiones calificadas; si faltan, responde 422 con la lista de dimensiones sin calificar. Es un supuesto (SUP21) que Diego debe confirmar.<\/li>\n<li>Responde 409 si la entidad ya lo envió. Después del envío, el <code>PUT<\/code> también responde 409 (<code>AutodiagnosticoEnviadoException<\/code>) y el autodiagnóstico no se reabre (supuesto, por confirmar).<\/li>\n<li><code>GET<\/code> y <code>PUT<\/code> suman <code>enviadoEn<\/code> (nulo si no se ha enviado), para que la pantalla bloquee los campos al abrir y no se entere por el 409, como pasa hoy con la finalización de formularios.<\/li>\n<li>Bitácora: el evento <code>AUTODIAGNOSTICO_ENVIADO<\/code>.<\/li>\n<li>Un solo punto de consulta, <code>AutodiagnosticoService.estaEnviado(entidad)<\/code>. Lo usa el diagnóstico oficial (H-12.2): sin envío, <code>PUT /api/diagnostico/{entidad}/oficial<\/code> y <code>PUT /api/diagnostico/{entidad}/aporte-expertos<\/code> responden 409 (FR096). Se revisa primero la asignación (403) y después el envío (409).<\/li>\n<li>Interfaz: botón «Enviar autodiagnóstico» con confirmación y la entrada al menú del beneficiario (<code>rol_menu<\/code>).<\/li>\n<li>Asignación de entidades a Gestor GMA (TK-22, FR123, historia H-3.6, ya en main con PR #84). La tabla provisional de T-12.2.1 la completa <code>V12_04<\/code>. H-13.1 depende de esta asignación.<\/li>\n<li>Un solo servicio, <code>AsignacionDeGestores<\/code>, en <code>campus/hojaderuta/service<\/code>. Lo usan H-12.2 y H-13.1, y nadie más lee <code>gestor_entidad<\/code>. El servicio provisional de T-12.2.1 se sustituye por este sin cambiar a quienes lo llaman.<\/li>\n<li>Consulta: <code>entidadesDe(gestor)<\/code> y <code>exigirAsignada(gestor, entidad)<\/code>. Regla: el Gestor sale del token y la entidad de la ruta (D07). Sin asignación, 403; también 403 si la entidad no existe, para no revelar cuáles hay.<\/li>\n<li>Administración, con el permiso nuevo <code>gestores:asignar-entidades<\/code> (solo <code>campus:administrador-campus<\/code>):<ul>\n<li><code>GET /api/gestores<\/code> lista las personas Gestor para elegir, con cuántas entidades tiene cada una, y filtra por texto.<\/li>\n<li><code>GET /api/gestores/{gestor}/entidades<\/code> lista las entidades asignadas.<\/li>\n<li><code>PUT /api/gestores/{gestor}/entidades/{entidad}<\/code> asigna. Asignar de nuevo lo ya asignado no repite nada ni deja registro, igual que habilitar integradores (H-3.4).<\/li>\n<li><code>DELETE /api/gestores/{gestor}/entidades/{entidad}<\/code> retira. Si no estaba asignada, responde 404.<\/li>\n<\/ul>\n<\/li>\n<li>Bitácora: <code>GESTOR_ENTIDAD_ASIGNADA<\/code> y <code>GESTOR_ENTIDAD_RETIRADA<\/code>, con gestor y entidad. El retiro borra la fila; la historia queda en la bitácora, que solo se agrega (D10).<\/li>\n<li>La pantalla del Administrador Campus no existe en el prototipo: UX debe diseñarla antes de construirla (ver «Preguntas abiertas»).<\/li>\n<li>Portal público (H-7.2, TK-25, PR #30): <code>GET /api/publico/convocatorias<\/code> y <code>POST /api/publico/inquietudes<\/code>, sin sesión, en <code>campus/convocatoria<\/code>. Son rutas públicas por método y ruta (ver «Tres reglas de seguridad»).<\/li>\n<li>La respuesta de la lista es la clase <code>ConvocatoriaPublicada<\/code>: nombre, términos, formulario, apertura, cierre, tipologías y actos. No trae topes, cupos, evaluadores, subcriterios ni criterios de empate, porque el PRD no los declara públicos.<\/li>\n<li>Una convocatoria está abierta entre la apertura y el cierre del cronograma, ambos incluidos, con la hora del servidor (D13). Sin fechas no aparece.<\/li>\n<li>La inquietud exige reCAPTCHA antes de validar o guardar (donde esté habilitado) y solo acepta una convocatoria abierta. Responde 201 sin cuerpo y no envía correo.<\/li>\n<li>La bitácora deja <code>INQUIETUD_RECIBIDA<\/code> sin datos personales.<\/li>\n<li>Excepción temporal: el nombre del formulario sale de un <code>LEFT JOIN<\/code> de solo lectura a la tabla <code>formulario<\/code>. Choca con «un módulo no lee las tablas de otro» (NFR017). Deuda: una interfaz de consulta que implemente el módulo de formularios y que <code>convocatoria<\/code> use en su lugar.<\/li>\n<li>Diagnóstico oficial (H-12.2, TK-26, PR #31): vive en <code>campus/hojaderuta<\/code> y exige el permiso <code>diagnostico:oficial<\/code> (solo <code>campus:gestor-gma<\/code>). Es el diagnóstico del Gestor GMA sobre una entidad asignada.<\/li>\n<li>API: <code>GET<\/code> y <code>PUT /api/diagnostico/{entidad}/oficial<\/code>, <code>GET<\/code> y <code>PUT /api/diagnostico/{entidad}/aporte-expertos<\/code> y <code>GET /api/diagnostico/{entidad}/autodiagnostico<\/code>.<\/li>\n<li>La entidad sale de la ruta y el Gestor del token (D07). Sin asignación responde 403, sin revelar si la entidad existe. La consulta va detrás del servicio de asignación provisional, que H-3.6 reemplaza sin cambiar a quien lo llama.<\/li>\n<li>Emitir va en el mismo <code>PUT<\/code> con <code>{\"emitir\": true}<\/code>. Exige las ocho dimensiones (400 si falta alguna). Ya emitido, cualquier cambio responde 409, incluido el aporte de expertos.<\/li>\n<li>Cada escritura bloquea la fila de la entidad (<code>MERGE<\/code> más <code>SELECT FOR UPDATE<\/code>), para que borrador y emisión no se crucen.<\/li>\n<li>La validación de 1 a 4 se comparte con el autodiagnóstico (<code>CalificacionesDelFormulario<\/code>).<\/li>\n<li>Bitácora: <code>DIAGNOSTICO_OFICIAL_GUARDADO<\/code>, <code>APORTE_EXPERTOS_GUARDADO<\/code> y <code>DIAGNOSTICO_OFICIAL_EMITIDO<\/code>.<\/li>\n<li>Hasta que se construya T-12.1.2 el diagnóstico oficial no exige el autodiagnóstico enviado. Luego pasa a exigirlo (409), como ya dice el envío del autodiagnóstico (TK-23).<\/li>\n<li>Circuito de firmas (H-14.1, PR #64, por unirse): <code>CircuitoDeFirmas<\/code> (dominio, función pura) y <code>CircuitoDeFirmasService<\/code> viven en <code>campus/hojaderuta<\/code>, no en <code>campus/firmas<\/code>, porque la regla de arquitectura prohíbe que <code>firmas<\/code> lea el dominio o el repositorio de <code>hojaderuta<\/code>. El controlador <code>CircuitoDeFirmasController<\/code> sí vive en <code>campus/firmas/controller<\/code>. Ajuste pendiente de aprobación del arquitecto.<\/li>\n<li><code>GET /api/hojas/{id}/firmas<\/code> devuelve el circuito de cuatro etapas y <code>tuTurno<\/code>, que dice si quien consulta firma la etapa en curso. <code>GET /api/firmas/pendientes<\/code> lista las hojas en las que quien consulta firma ahora. Ambos exigen <code>firmas:ver<\/code>.<\/li>\n<li><code>etapa_firma<\/code> es la etapa en curso (1 a 4); 0 quiere decir que la hoja no se ha enviado. Hasta H-14.2 no hay firmas guardadas, así que todas las partes de la etapa en curso aparecen pendientes.<\/li>\n<li>Pantallas: <code>/firmas<\/code> (hojas pendientes) y <code>/hojas-de-ruta/:id/firmas<\/code> (circuito con el aviso «Todavía no es su turno» y el botón de firma bloqueado).<\/li>\n<li>Ciclos de firma (H-14.3, PR #67, por unirse): la tabla <code>firma<\/code> gana <code>ciclo<\/code> y su llave pasa a ser hoja, ciclo y parte (<code>UNIQUE (hoja, ciclo, parte)<\/code>); hoy la llave es hoja y parte (<code>V14_02<\/code>). Una devolución abre un ciclo nuevo: las firmas del ciclo anterior quedan no vigentes y no se borran (FR111, D10). La tabla <code>devolucion<\/code> es de solo agregar. Su migración es <code>V14_06<\/code>, porque <code>V14_03<\/code> ya es el PDF oficial en main.<\/li>\n<li>PDF sin precios (H-14.5, PR #71, por unirse): <code>GET /api/hojas/{id}/pdf-sin-precios<\/code>, con el permiso <code>firmas:ver-sin-precios<\/code>. Lo guarda la tabla <code>pdf_sin_precios_hoja<\/code> (<code>V14_04<\/code>): sello de 64 caracteres, único por hoja y de solo agregar, como el PDF oficial (D09, D10).<\/li>\n<li>Verificación del PDF (H-14.6, PR #70, por unirse): <code>POST /api/firmas/verificacion<\/code>, con el permiso <code>firmas:verificar<\/code>. Recibe un PDF y dice si coincide con el oficial o con el de sin precios (FR114, D09). Sale de <code>V14_05<\/code>.<\/li>\n<li>Firmantes según el PRD (<code>V14_07<\/code>): la etapa 3 la firman los integradores y el Líder o Gerente GMA (FR109); el Gestor GMA no firma. <code>campus:gerente-gma<\/code> recibe <code>firmas:ver<\/code>, <code>firmas:etapa-3<\/code>, <code>firmas:firmar<\/code>, <code>firmas:devolver<\/code>, <code>firmas:verificar<\/code> y el permiso nuevo <code>firmas:lider-gma<\/code>, que es lo único que hace firmar como Líder GMA; <code>campus:gestor-gma<\/code> pierde esos permisos. Un integrador sin Ceiba o Connect resuelto no firma la etapa 3 por nadie.<\/li>\n<li>Caracterización de la entidad (H-11.1, PR #36): <code>CaracterizacionService<\/code>, en <code>campus/catalogo<\/code>. Es el único punto de lectura de las entidades validadas: el directorio de H-11.2 lo consultará con <code>validadas()<\/code>.<\/li>\n<li><code>POST /api/caracterizacion/envio<\/code>, con el permiso <code>caracterizacion:enviar<\/code> (solo <code>campus:beneficiario<\/code>). La entidad sale del token (D07). Responde 422 con la lista de faltas si el formulario no está completo, y 409 si la entidad ya está en validación o validada.<\/li>\n<li><code>GET /api/caracterizacion/mia<\/code> devuelve el estado de la caracterización de la propia entidad.<\/li>\n<li><code>GET /api/caracterizacion/por-validar<\/code> lista lo que espera validación. <code>POST /api/caracterizacion/{id}/validacion<\/code>, con <code>caracterizacion:validar<\/code>, valida o devuelve. Devolver exige una observación y reabre el formulario para que la entidad lo corrija.<\/li>\n<li>El permiso <code>caracterizacion:validar<\/code> lo asigna <code>V11_02<\/code> solo a <code>campus:administrador-campus<\/code>.<\/li>\n<li>Carta de formalización (H-10.1, PR #73, por unirse): el seleccionado descarga el Formato 6, firma la carta y la sube. Al subirla, la postulación pasa a EN_FORMALIZACION (FR092). La ubicación en
