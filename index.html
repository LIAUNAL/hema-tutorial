ral: el nombre del formulario sale de un <code>LEFT JOIN<\/code> de solo lectura a la tabla <code>formulario<\/code>. Choca con «un módulo no lee las tablas de otro» (NFR017). Deuda: una interfaz de consulta que implemente el módulo de formularios y que <code>convocatoria<\/code> use en su lugar.<\/li>\n<li>Diagnóstico oficial (H-12.2, TK-26, PR #31): vive en <code>campus/hojaderuta<\/code> y exige el permiso <code>diagnostico:oficial<\/code> (solo <code>campus:gestor-gma<\/code>). Es el diagnóstico del Gestor GMA sobre una entidad asignada.<\/li>\n<li>API: <code>GET<\/code> y <code>PUT /api/diagnostico/{entidad}/oficial<\/code>, <code>GET<\/code> y <code>PUT /api/diagnostico/{entidad}/aporte-expertos<\/code> y <code>GET /api/diagnostico/{entidad}/autodiagnostico<\/code>.<\/li>\n<li>La entidad sale de la ruta y el Gestor del token (D07). Sin asignación responde 403, sin revelar si la entidad existe. La consulta va detrás del servicio de asignación provisional, que H-3.6 reemplaza sin cambiar a quien lo llama.<\/li>\n<li>Emitir va en el mismo <code>PUT<\/code> con <code>{\"emitir\": true}<\/code>. Exige las ocho dimensiones (400 si falta alguna). Ya emitido, cualquier cambio responde 409, incluido el aporte de expertos.<\/li>\n<li>Cada escritura bloquea la fila de la entidad (<code>MERGE<\/code> más <code>SELECT FOR UPDATE<\/code>), para que borrador y emisión no se crucen.<\/li>\n<li>La validación de 1 a 4 se comparte con el autodiagnóstico (<code>CalificacionesDelFormulario<\/code>).<\/li>\n<li>Bitácora: <code>DIAGNOSTICO_OFICIAL_GUARDADO<\/code>, <code>APORTE_EXPERTOS_GUARDADO<\/code> y <code>DIAGNOSTICO_OFICIAL_EMITIDO<\/code>.<\/li>\n<li>Hasta que se construya T-12.1.2 el diagnóstico oficial no exige el autodiagnóstico enviado. Luego pasa a exigirlo (409), como ya dice el envío del autodiagnóstico (TK-23).<\/li>\n<li>Circuito de firmas (H-14.1, PR #64, por unirse): <code>CircuitoDeFirmas<\/code> (dominio, función pura) y <code>CircuitoDeFirmasService<\/code> viven en <code>campus/hojaderuta<\/code>, no en <code>campus/firmas<\/code>, porque la regla de arquitectura prohíbe que <code>firmas<\/code> lea el dominio o el repositorio de <code>hojaderuta<\/code>. El controlador <code>CircuitoDeFirmasController<\/code> sí vive en <code>campus/firmas/controller<\/code>. Ajuste pendiente de aprobación del arquitecto.<\/li>\n<li><code>GET /api/hojas/{id}/firmas<\/code> devuelve el circuito de cuatro etapas y <code>tuTurno<\/code>, que dice si quien consulta firma la etapa en curso. <code>GET /api/firmas/pendientes<\/code> lista las hojas en las que quien consulta firma ahora. Ambos exigen <code>firmas:ver<\/code>.<\/li>\n<li><code>etapa_firma<\/code> es la etapa en curso (1 a 4); 0 quiere decir que la hoja no se ha enviado. Hasta H-14.2 no hay firmas guardadas, así que todas las partes de la etapa en curso aparecen pendientes.<\/li>\n<li>Pantallas: <code>/firmas<\/code> (hojas pendientes) y <code>/hojas-de-ruta/:id/firmas<\/code> (circuito con el aviso «Todavía no es su turno» y el botón de firma bloqueado).<\/li>\n<li>Ciclos de firma (H-14.3, PR #67, por unirse): la tabla <code>firma<\/code> gana <code>ciclo<\/code> y su llave pasa a ser hoja, ciclo y parte (<code>UNIQUE (hoja, ciclo, parte)<\/code>); hoy la llave es hoja y parte (<code>V14_02<\/code>). Una devolución abre un ciclo nuevo: las firmas del ciclo anterior quedan no vigentes y no se borran (FR111, D10). La tabla <code>devolucion<\/code> es de solo agregar. Su migración es <code>V14_06<\/code>, porque <code>V14_03<\/code> ya es el PDF oficial en main.<\/li>\n<li>PDF sin precios (H-14.5, PR #71, por unirse): <code>GET /api/hojas/{id}/pdf-sin-precios<\/code>, con el permiso <code>firmas:ver-sin-precios<\/code>. Lo guarda la tabla <code>pdf_sin_precios_hoja<\/code> (<code>V14_04<\/code>): sello de 64 caracteres, único por hoja y de solo agregar, como el PDF oficial (D09, D10).<\/li>\n<li>Verificación del PDF (H-14.6, PR #70, por unirse): <code>POST /api/firmas/verificacion<\/code>, con el permiso <code>firmas:verificar<\/code>. Recibe un PDF y dice si coincide con el oficial o con el de sin precios (FR114, D09). Sale de <code>V14_05<\/code>.<\/li>\n<li>Firmantes según el PRD (<code>V14_07<\/code>): la etapa 3 la firman los integradores y el Líder o Gerente GMA (FR109); el Gestor GMA no firma. <code>campus:gerente-gma<\/code> recibe <code>firmas:ver<\/code>, <code>firmas:etapa-3<\/code>, <code>firmas:firmar<\/code>, <code>firmas:devolver<\/code>, <code>firmas:verificar<\/code> y el permiso nuevo <code>firmas:lider-gma<\/code>, que es lo único que hace firmar como Líder GMA; <code>campus:gestor-gma<\/code> pierde esos permisos. Un integrador sin Ceiba o Connect resuelto no firma la etapa 3 por nadie.<\/li>\n<li>Caracterización de la entidad (H-11.1, PR #36): <code>CaracterizacionService<\/code>, en <code>campus/catalogo<\/code>. Es el único punto de lectura de las entidades validadas: el directorio de H-11.2 lo consultará con <code>validadas()<\/code>.<\/li>\n<li><code>POST /api/caracterizacion/envio<\/code>, con el permiso <code>caracterizacion:enviar<\/code> (solo <code>campus:beneficiario<\/code>). La entidad sale del token (D07). Responde 422 con la lista de faltas si el formulario no está completo, y 409 si la entidad ya está en validación o validada.<\/li>\n<li><code>GET /api/caracterizacion/mia<\/code> devuelve el estado de la caracterización de la propia entidad.<\/li>\n<li><code>GET /api/caracterizacion/por-validar<\/code> lista lo que espera validación. <code>POST /api/caracterizacion/{id}/validacion<\/code>, con <code>caracterizacion:validar<\/code>, valida o devuelve. Devolver exige una observación y reabre el formulario para que la entidad lo corrija.<\/li>\n<li>El permiso <code>caracterizacion:validar<\/code> lo asigna <code>V11_02<\/code> solo a <code>campus:administrador-campus<\/code>.<\/li>\n<li>Carta de formalización (H-10.1, PR #73, por unirse): el seleccionado descarga el Formato 6, firma la carta y la sube. Al subirla, la postulación pasa a EN_FORMALIZACION (FR092). La ubicación en el código se confirma en el PR; la propuesta es <code>campus/postulacion<\/code>, porque cambia su estado.<\/li>\n<li><code>GET /api/formalizacion/carta<\/code> devuelve el firmante: «Líder del proyecto» si la entidad es persona natural de tipología EBCT, y «Representante legal» en otro caso. Lee <code>PerfilesDeUsuario.tipoPersonaDeEntidad<\/code> y <code>ElegiblesService.tipologiaDe<\/code>, sin migraciones nuevas.<\/li>\n<li><code>POST /api/formalizacion/carta<\/code> recibe la carta firmada y exige <code>formalizacion:cargar<\/code>. El formato del cuerpo se confirma en el PR.<\/li>\n<li>Tabla <code>carta_formalizacion<\/code> (<code>V10_01<\/code>): <code>postulacion_id<\/code>, <code>archivo_id<\/code>, <code>cargada_por<\/code> y <code>cargada_en<\/code>. Al cargarla, la bitácora deja <code>CARTA_FORMALIZACION_CARGADA<\/code>.<\/li>\n<li>Revisión de la carta (H-10.2, PR #77, por unirse). Al revisarla, <code>main<\/code> aún no trae estos cambios: no hay <code>V10_03<\/code> ni los endpoints. Lo que sigue es lo que pide el PR.<ul>\n<li><code>GET /api/formalizacion/cartas<\/code> lista las cartas por revisar.<\/li>\n<li><code>POST /api/formalizacion/{id}/validacion<\/code> valida la carta. Al validarla, la postulación pasa a BENEFICIARIO (FR092).<\/li>\n<li><code>POST /api/formalizacion/{id}/subsanacion<\/code>, con cuerpo <code>{\"motivo\": \"...\"}<\/code>, pide corregir la carta. Responde 409 en los casos que el PR impide (por confirmar).<\/li>\n<li><code>GET /api/formalizacion/{id}/carta/archivo<\/code> entrega el PDF de la carta.<\/li>\n<li>Bitácora: <code>CARTA_SUBSANACION_PEDIDA<\/code>, <code>CARTA_FORMALIZACION_VALIDADA<\/code> y <code>CARTA_FORMALIZACION_REENVIADA<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>Estados de la postulación (H-8.3, PR #37): <code>MaquinaDeEstados<\/code>, en <code>campus/postulacion<\/code>. Aplica las transiciones guardadas en <code>estado_postulacion<\/code> y <code>transicion_postulacion<\/code> (<code>V8_04<\/code>), con 14 estados: 8 que avanzan y 6 rechazos definitivos (D11). <code>V10_02<\/code> agrega EN_FORMALIZACION y quedan 15: 9 que avanzan y 6 rechazos. El estado de SARLAFT va aparte, en <code>postulacion.estado_sarlaft<\/code> (FR080). Tras TK-40, la transición es SELECCIONADA → EN_FORMALIZACION → BENEFICIARIO: <code>V10_02<\/code> quita SELECCIONADA → BENEFICIARIO y agrega las dos nuevas. Desde EN_FORMALIZACION no hay otra salida todavía (ver «Preguntas abiertas»). La carta de formalización (FR092) usa el estado EN_FORMALIZACION: al subirla, la postulación pasa a EN_FORMALIZACION, y al validarla, a BENEFICIARIO.<\/li>\n<li><code>GET /api/postulaciones/mia/estado<\/code> lo consulta el beneficiario.<\/li>\n<li><code>GET /api/postulaciones<\/code> lista con filtro y búsqueda, con el permiso <code>postulacion:listar<\/code>. La lista de tipologías del filtro sale vacía hasta decidir TK-28.<\/li>\n<li>Desde H-16.4 (PR #62, unido), cada fila trae <code>estadoSarlaft<\/code> solo si quien consulta tiene <code>sarlaft:consultar<\/code>; los demás reciben el campo en null. Así el estado SARLAFT, que es dato personal, no llega a los roles que no lo revisan (NFR004).<\/li>\n<li>Los nombres de los 15 estados y los roles con <code>postulacion:listar<\/code> son propuesta por confirmar con ATENEA (ver «Preguntas abiertas»).<\/li>\n<li>Alta de usuarios (H-2.6, TK-17, PR #25): <code>AdministracionDeUsuarios.darDeAlta<\/code> es el alta común del administrador y del registro público. <code>GestionDeCuentasKeycloak.crear<\/code> borra la cuenta recién creada en Keycloak si falla la asignación del rol, para que no quede una cuenta sin rol con el nombre de usuario tomado.<\/li>\n<li>\n<p>Consulta de la bitácora (H-16.2, TK-31, PR #38): <code>GET /api/bitacora?inicio=&amp;fin=<\/code>. Las fechas van en formato AAAA-MM-DD y el rango se compara en hora de Colombia (D13), con inicio y fin incluidos: desde el comienzo del día de inicio hasta el final del día de fin. Devuelve como máximo 1000 filas; si hay más, la respuesta avisa que la lista quedó truncada. La ruta es solo de lectura: no tiene PUT, DELETE ni PATCH.<\/p>\n<\/li>\n<li>\n<p>Panel de asignación (H-9.5, PR #56, por unirse): asigna las postulaciones candidatas al panel, registra sus votos y cita al panel.<\/p>\n<\/li>\n<li><code>GET /api/panel/candidatas<\/code> lista las postulaciones candidatas.<\/li>\n<li><code>GET /api/panel/{postulacion}<\/code> muestra una postulación del panel.<\/li>\n<li><code>PUT /api/panel/{postulacion}/votos<\/code> guarda los votos de esa postulación.<\/li>\n<li><code>POST /api/panel/{postulacion}/citacion<\/code> cita al panel.<\/li>\n<li>Los cuatro exigen el permiso <code>panel:administrar<\/code>.<\/li>\n<li>La citación debe tener al menos dos días hábiles intermedios entre el envío y la fecha del panel (FR086). La propiedad <code>hema.panel.dias-habiles-anticipacion<\/code> fija ese número: por omisión 2, y se puede configurar. El PRD (FR086) dice un día hábil; la diferencia la decide Diego (PO).<\/li>\n<li>Ranking por tipología y desempates (H-9.6, PR #58, <code>V9_04<\/code>, revisado y en unión): ordena las postulaciones de cada tipología con los criterios de empate de su convocatoria (D11).<\/li>\n<li><code>GET /api/convocatorias/para-ranking<\/code> lista las convocatorias para las que se puede consultar el ranking.<\/li>\n<li><code>GET /api/convocatorias/{id}/ranking?tipologia=<\/code> devuelve el ranking de esa tipología dentro de la convocatoria.<\/li>\n<li>Los dos exigen <code>ranking:consultar<\/code>, que solo tienen <code>campus:comite-evaluador<\/code> y <code>campus:arranque-prueba<\/code>.<\/li>\n<li><code>RankingService<\/code> arma el ranking con tres lecturas: <code>ConvocatoriaService.reglasDeRanking<\/code> (criterios de empate), <code>ConvocatoriaService.convocatoriasParaRanking<\/code> (convocatorias) y <code>EstadoDePostulacionService.candidatasParaRanking<\/code> (postulaciones candidatas).<\/li>\n<li>\n<p>Las lecturas de postulaciones salen de <code>ConsultaDePostulaciones.deConvocatoria<\/code>. Ninguna toca tablas de otros módulos (D20).<\/p>\n<\/li>\n<li>\n<p>Evaluación de foco y antecedentes (H-9.2, PR #57, <code>V9_02<\/code>, por unirse), en <code>campus/evaluacion<\/code>. Es la evaluación preliminar de cada postulación: el foco la revisa el comité y los antecedentes la Gerencia CTeI.<\/p>\n<\/li>\n<li><code>FocoYAntecedentesService<\/code> evalúa el foco sin subsanación. Si el foco no cumple, la postulación pasa a RECHAZADA_FOCO y no activa SARLAFT. Si cumple, <code>estado_sarlaft<\/code> pasa a EN_REVISION.<\/li>\n<li>Los antecedentes los evalúa la Gerencia CTeI. Si el plazo de la cédula vence sin entrega, quedan en NO_CUMPLE y bloquean el Paso 2.<\/li>\n<li><code>GET /api/evaluaciones<\/code> y <code>GET /api/evaluaciones/{id}<\/code> consultan. <code>PUT /api/evaluaciones/{id}/foco<\/code> exige <code>evaluacion:foco<\/code>. <code>PUT /api/evaluaciones/{id}/antecedentes<\/code> y <code>POST /api/evaluaciones/{id}/antecedentes/solicitar-cedula<\/code> exigen <code>evaluacion:antecedentes<\/code>.<\/li>\n<li><code>GET /api/evaluaciones/{id}/cedula/archivo<\/code> exige <code>evaluacion:ver<\/code> y responde con <code>Content-Disposition<\/code> de adjunto y <code>X-Content-Type-Options<\/code> en <code>nosniff<\/code>.<\/li>\n<li>Subsanación de la cédula: el beneficiario sube solo la copia de la cédula de su representante legal, en PDF o imagen de hasta 10 MB, por el formulario web, dentro del plazo y con aviso por correo. La validación pasa por <code>ArchivoService<\/code>.<\/li>\n<li><code>GET /api/postulaciones/mia/cedula<\/code>, y <code>GET<\/code> y <code>POST /api/postulaciones/{id}/cedula<\/code>, exigen <code>postulacion:subsanar<\/code>. La entidad sale siempre del token (D07); sin perfil responde 403.<\/li>\n<li>Tabla <code>evaluacion_preliminar<\/code>, con una fila por postulación.<\/li>\n<li>Permisos (<code>V9_02<\/code>): <code>evaluacion:ver<\/code> va a <code>campus:comite-evaluador<\/code>, <code>campus:gerencia-ctei<\/code>, <code>campus:enlace-sarlaft<\/code> y <code>campus:arranque-prueba<\/code>. <code>evaluacion:foco<\/code> va al comité y a <code>campus:arranque-prueba<\/code>. <code>evaluacion:antecedentes<\/code> va a la Gerencia CTeI y a <code>campus:arranque-prueba<\/code>. El rol de prueba los recibe en esta misma migración, como ya pasa con <code>panel:administrar<\/code>.<\/li>\n<li>Frontera: <code>campus/evaluacion<\/code> no lee las tablas de postulación. Usa <code>PostulacionesParaEvaluacionService<\/code> y <code>RepositorioDePostulacionesEvaluacion<\/code>, en <code>campus/postulacion/service<\/code> y <code>repository<\/code>, y una regla de ArchUnit lo vigila.<\/li>\n<li>Revisión SARLAFT (H-9.3, PR #60, <code>V9_08<\/code>, por unirse), en <code>campus/evaluacion<\/code>. Revisa las postulaciones cuyo foco está en CUMPLE.<\/li>\n<li><code>GET /api/sarlaft<\/code> lista solo las postulaciones con foco en CUMPLE.<\/li>\n<li><code>PUT /api/sarlaft/{postulacion}<\/code> registra el resultado: SATISFACTORIO, ACLARACION (exige observación) o NO_SATISFACTORIO, que es definitivo.<\/li>\n<li>Responde 409 si el foco no está en CUMPLE o si la postulación ya tiene un resultado definitivo.<\/li>\n<li>Ambos exigen <code>sarlaft:revisar<\/code>, que solo tienen <code>campus:enlace-sarlaft<\/code> y <code>campus:arranque-prueba<\/code>.<\/li>\n<li>Plan de trabajo (H-15.1, PR #75, <code>V15_01<\/code>, por unirse), en <code>campus/seguimiento<\/code>. Es el plan que propone el integrador para sus servicios y que el Gestor GMA aprueba o devuelve (FR115, FR116). Las pantallas <code>/plan<\/code> y <code>/plan-revision<\/code> aún no existen en <code>docs/rutas.md<\/code>.<\/li>\n<li><code>GET<\/code> y <code>PUT /api/planes/{servicio}<\/code> leen y guardan el plan de un servicio. <code>PUT<\/code> exige <code>planes:proponer<\/code>, que solo tiene <code>campus:integrador<\/code>. <code>GET<\/code> exige cualquiera de los dos permisos, <code>planes:proponer<\/code> o <code>planes:aprobar<\/code> (<code>hasAnyAuthority<\/code> en <code>PlanDeTrabajoController<\/code>), así que lo ven el integrador que propone y el Gestor GMA que aprueba.<\/li>\n<li><code>POST /api/planes/{servicio}/envio<\/code>, con <code>planes:proponer<\/code>, manda el plan al Gestor GMA, y el plan queda en estado ENVIADO.<\/li>\n<li><code>POST /api/planes/{servicio}/decision<\/code>, con <code>planes:aprobar<\/code> (solo <code>campus:gestor-gma<\/code>), recibe APROBAR o DEVOLVER. Con APROBAR, el plan queda en estado APROBADO. Con DEVOLVER, el plan vuelve a BORRADOR para que el integrador lo ajuste y reenvíe; la devolución queda como evento <code>DEVUELTO<\/code> en <code>plan_evento<\/code>, con su retroalimentación. <code>DEVUELTO<\/code> no es un estado: solo existe en el historial.<\/li>\n<li>Tres tablas: <code>plan_servicio<\/code>, con el estado de cada plan (BORRADOR, ENVIADO o APROBADO); <code>plan_actividad<\/code>, con las actividades del plan; y <code>plan_evento<\/code>, el historial de solo agregar (D10), de donde sale la historia de devoluciones.<\/li>\n<li>\n<p>Bitácora: <code>PLAN_ENVIADO<\/code>, <code>PLAN_APROBADO<\/code> y <code>PLAN_DEVUELTO<\/code>.<\/p>\n<\/li>\n<li>\n<p>Hitos y evidencias (H-15.2, PR #76, <code>V15_02<\/code>, por unirse), en <code>campus/seguimiento<\/code>. Es el avance que el integrador reporta sobre su servicio y que el Gestor GMA valida o devuelve.<\/p>\n<\/li>\n<li><code>POST /api/hitos<\/code>, en formato multipart, con <code>servicio<\/code>, <code>descripcion<\/code> y <code>evidencia<\/code>. El campo <code>hito<\/code> es opcional y sirve para corregir uno devuelto. Exige <code>hitos:reportar<\/code> (solo <code>campus:integrador<\/code>) y que el plan del servicio esté APROBADO. Sin evidencia responde 400. La evidencia pasa por <code>ArchivoService<\/code>, con los formatos de la sección de archivos (PDF, Word, Excel o imagen) y hasta 10 MB.<\/li>\n<li><code>POST /api/hitos/{id}/decision<\/code>, con <code>VALIDAR<\/code> o <code>DEVOLVER<\/code>. Exige <code>hitos:validar<\/code> (solo <code>campus:gestor-gma<\/code>). Devolver exige retroalimentación.<\/li>\n<li>Tabla <code>hito<\/code>: <code>servicio_id<\/code> (referencia a <code>plan_servicio<\/code>), <code>descripcion<\/code> (hasta 500 caracteres), <code>evidencia_id<\/code> (referencia a <code>archivo<\/code>), <code>estado<\/code> (POR_VALIDAR, VALIDADO o DEVUELTO), <code>reportado_en<\/code> y <code>reportado_por<\/code>.<\/li>\n<li>Tabla <code>hito_evento<\/code>, de solo agregar (D10): eventos REPORTADO, CORREGIDO, VALIDADO y DEVUELTO, cada uno con su evidencia y su retroalimentación.<\/li>\n<li>\n<p>Bitácora: <code>HITO_REPORTADO<\/code> (también al corregir), <code>HITO_VALIDADO<\/code> y <code>HITO_DEVUELTO<\/code>. Las dos últimas están por confirmar en el código: el diff del PR no las mostró completas.<\/p>\n<\/li>\n<li>\n<p>Cierre del servicio (H-15.3, PR #78, por unirse), en <code>campus/seguimiento<\/code>. Es el paso en que el beneficiario da su conformidad y el Gestor GMA cierra el servicio con el acta de recibido técnico (FR119). Cada paso se da una sola vez.<\/p>\n<\/li>\n<li><code>POST /api/servicios/{id}/conformidad<\/code>, con <code>servicios:conformar<\/code> (solo <code>campus:beneficiario<\/code>). La entidad sale del token (D07). La base impide darla dos veces.<\/li>\n<li><code>POST /api/servicios/{id}/cierre<\/code>, en multipart, con <code>prestado<\/code> y <code>acta<\/code>. Exige <code>servicios:cerrar<\/code> (solo <code>campus:gestor-gma<\/code>) y que el Gestor tenga asignada la entidad del servicio (<code>AsignacionDeGestores<\/code>, D17); si no la tiene, responde 403. El acta pasa por <code>ArchivoService<\/code>.<\/li>\n<li><code>GET /api/servicios/{id}/cierre<\/code> lee el estado para las pantallas y acepta <code>servicios:cerrar<\/code> o <code>servicios:conformar<\/code>. Este GET no estaba en la historia H-15.3; lo agrega este PR y el plan debe recogerlo.<\/li>\n<li>Tablas (<code>V15_03<\/code>): <code>conformidad_servicio<\/code> y <code>cierre_servicio<\/code>, con una fila por servicio en cada una (llave primaria <code>servicio_id<\/code>). <code>cierre_servicio<\/code> tiene llave foránea a <code>conformidad_servicio<\/code> y al archivo del acta.<\/li>\n<li>Bitácora: <code>SERVICIO_CONFORMADO<\/code> y <code>SERVICIO_CERRADO<\/code>.<\/li>\n<li>Interfaz: las rutas <code>/conformidad<\/code> (beneficiario, con <code>servicios:conformar<\/code>) y <code>/cierre<\/code> (Gestor GMA, con <code>servicios:cerrar<\/code>) van en el menú Seguimiento.<\/li>\n<li>Avance por beneficiario (H-15.4, PR #83, por unirse), en <code>campus/seguimiento<\/code>. <code>GET /api/beneficiarios/avance<\/code> exige <code>seguimiento:consultar<\/code>. El alcance sale del permiso adicional y del perfil del token: <code>seguimiento:consultar-todos<\/code> (solo <code>campus:administrador-campus<\/code>) ve todas las entidades; <code>seguimiento:consultar-asignados<\/code> (solo <code>campus:gestor-gma<\/code>) ve solo las entidades asignadas (D17); sin permiso adicional, solo la entidad del perfil; sin perfil o sin entidad, 403 sin usar el nombre de usuario (D07). Los servicios con su entidad salen de <code>ServicioDeHojaService.serviciosConEntidad()<\/code> (TK-34, D20); el módulo solo lee <code>cierre_servicio<\/code>.<\/li>\n<\/ul>"}, {"n": 11, "titulo": "Diagnóstico y hoja de ruta", "roles": ["Gestor GMA", "Beneficiario"], "prd": ["### Diagnóstico", "### Hoja de ruta"], "historias": ["H-12.1", "H-12.2", "H-12.3", "H-13.1", "H-13.3", "H-13.4"], "spec": ["## Datos y su clasificación"], "resumen": "Autodiagnóstico del beneficiario, diagnóstico oficial del Gestor GMA, informe de brechas y hojas de ruta con topes de valor y bolsa.", "usuarios": "qa.beneficiario, qa.gestor-gma", "video": "videos/cap11.mp4", "vtt": "WEBVTT\n\n1\n00:00:03.100 --> 00:00:05.184\nCapítulo once.\n\n2\n00:00:05.134 --> 00:00:08.625\nEl diagnóstico de la entidad y la hoja de ruta.\n\n3\n00:00:09.238 --> 00:00:15.372\nEl beneficiario abre Autodiagnóstico y califica de uno a cuatro cada dimensión de su empresa.\n\n4\n00:00:15.928 --> 00:00:25.096\nEstrategia, gobierno corporativo, digitalización, capital humano, finanzas y mercado, entre otras.\n\n5\n00:00:25.046 --> 00:00:27.624\nLo que escribe se guarda solo.\n\n6\n00:00:28.234 --> 00:00:33.509\nEl gestor GMA hace el diagnóstico oficial, con aporte de expertos.\n\n7\n00:00:34.060 --> 00:00:41.340\nCon los dos, el informe de brechas muestra dónde difieren más y qué servicios de Campus atienden cada brecha.\n\n8\n00:00:41.902 --> 00:00:49.143\nAhora el gestor GMA, que arma la hoja de ruta de cada beneficiario con los servicios del catálogo vigente.\n\n9\n00:00:49.696 --> 00:00:56.768\nHēma controla el tope de valor por hoja y la bolsa del beneficiario, y no muestra precios a quien no debe verlos.\n\n10\n00:00:57.322 --> 00:01:01.230\nEn Avance por beneficiario sigue cómo va cada uno.\n\n", "prd_html": "<h3>Diagnóstico<\/h3>\n<ul>\n<li>FR095. El beneficiario diligencia el autodiagnóstico en las 8 dimensiones oficiales (Estrategia, Gobierno Corporativo, Eficiencia Operativa, Digitalización e IA, Innovación y Diferenciación, Capital Humano, Finanzas y Escalabilidad, Mercado y Crecimiento Comercial), sin ver precios.\n  Criterio: dado un autodiagnóstico, cuando se muestra, entonces trae 8 dimensiones y ningún precio. (R-18; XL2 P-25; C-10)<\/li>\n<li>FR124. Cuando el beneficiario envía su autodiagnóstico con las 8 dimensiones calificadas (SUP21), el sistema guarda la fecha de envío, lo bloquea para edición y lo registra en la bitácora (FR121).\n  Criterio: dado un autodiagnóstico completo, cuando el beneficiario pulsa «Enviar autodiagnóstico», entonces queda con fecha de envío, ya no se edita y la bitácora trae el registro. (TK-23; R-18)<\/li>\n<li>FR096. El Gestor GMA registra el diagnóstico oficial con el mismo formulario, solo de las entidades que tiene asignadas (FR123) y solo si la entidad envió su autodiagnóstico (FR124).\n  Criterio: dado un autodiagnóstico enviado, cuando el Gestor asignado lo abre, entonces diligencia el mismo formulario.\n  Criterio: dado una entidad sin autodiagnóstico enviado, cuando el Gestor intenta registrar el diagnóstico oficial, entonces el servidor lo rechaza y no guarda nada. (R-19; TK-23)<\/li>\n<li>FR097. El Gestor GMA deja registrado el aporte del grupo de expertos como apoyo propio; los expertos no tienen usuario.\n  Criterio: dado un diagnóstico, cuando el Gestor guarda el aporte, entonces queda a su nombre. (R-20; XL2 P-21)<\/li>\n<li>FR098. El sistema calcula por dimensión el delta: autodiagnóstico menos diagnóstico del Gestor.\n  Criterio: dado 3 de autodiagnóstico y 2 del Gestor, cuando se calcula, entonces el delta es 1. (R-21; XL2 P-25)<\/li>\n<li>FR099. El sistema emite el informe de brechas con criticidad por dimensión y los servicios de Campus que las atienden, visible para el beneficiario sin precios. Escala y umbrales: SUP08.\n  Criterio: dado un informe, cuando el beneficiario lo abre, entonces ve brechas y servicios sin precios. (R-22)<\/li>\n<\/ul>\n<h3>Hoja de ruta<\/h3>\n<ul>\n<li>FR100. El Gestor GMA elige los servicios que atienden cada brecha; el sistema ofrece solo servicios marcados como Campus.\n  Criterio: dado un servicio no Campus, cuando se busca para una brecha, entonces no aparece. (R-23, R-06)<\/li>\n<li>FR101. El Gestor GMA, el integrador y el beneficiario co-diseñan la ficha de cada servicio con metas e indicadores.\n  Criterio: dado una ficha, cuando se guarda, entonces registra meta, indicador y quién la editó. (R-43; XL2 P-23)<\/li>\n<li>FR102. El Gestor GMA decide en cuántas hojas de ruta se divide la atención según las brechas y su prioridad.\n  Criterio: dado seis brechas, cuando el Gestor las agrupa en dos hojas, entonces cada una se firma por separado. (R-25; XL2 P-23)<\/li>\n<li>FR103. El sistema impide guardar una ficha cuyo valor supere el precio del servicio en la versión vigente del catálogo.\n  Criterio: dado un precio de catálogo de 10 millones, cuando la ficha dice 11, entonces no se guarda. (R-24)<\/li>\n<li>FR104. El sistema impide que la suma de fichas de un beneficiario supere el tope de su tipología. Cada hoja descuenta lo aprobado, no lo ejecutado (SUP09).\n  Criterio: dado un beneficiario EAI con 45 millones aprobados, cuando una ficha suma 6, entonces el sistema la rechaza. (R-24, R-25; P-34)<\/li>\n<li>FR105. En una tarifa por rango, el valor de la ficha debe estar entre el mínimo y el máximo del catálogo. El tope se compara sin IVA y los valores en dólares o euros se convierten a pesos con la tasa del día de la ficha (SUP10).\n  Criterio: dado un rango de 5 a 8 millones, cuando la ficha dice 9, entonces no se guarda. (R-04, R-24; P-35)<\/li>\n<li>FR106. Cada beneficiario tiene una sola bolsa; el sistema no fija un reparto entre integradores.\n  Criterio: dado un beneficiario con servicios de Ceiba y Connect, cuando se valida el tope, entonces suma todos juntos. (R-26; C-17, P-54)<\/li>\n<li>FR107. El sistema muestra la hoja según el rol: el beneficiario, sin precios; cada integrador, solo lo suyo con sus precios; Gestión presupuestal, todo.\n  Criterio: dado un beneficiario o un integrador ajeno, cuando abre la hoja, entonces la respuesta del servidor no incluye precios ni servicios que no le corresponden. (R-27; NFR001)<\/li>\n<\/ul>", "historia_html": "<h4>H-12.1 Autodiagnóstico<\/h4>\n<p>Es el formulario donde el beneficiario califica las ocho dimensiones. Sirve para partir de su propia mirada.<\/p>\n<p>Como beneficiario, quiero calificar mi entidad en ocho dimensiones, para empezar el diagnóstico.<\/p>\n<p>De dónde sale: PRD («Diagnóstico»), UX («Autodiagnóstico»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#autodiagnostico\">Ver la pantalla<\/a>.<\/p>\n<p>Servicios: <code>GET<\/code> y <code>PUT /api/diagnostico/autodiagnostico<\/code> y <code>POST /api/diagnostico/autodiagnostico/envio<\/code>, permiso <code>diagnostico:autoevaluar<\/code>; nunca devuelven precios.<\/p>\n<p>Cómo se sabe que está lista:\n- Califica de 1 a 4 las ocho dimensiones oficiales: Estrategia, Gobierno Corporativo, Eficiencia Operativa, Digitalización e IA, Innovación y Diferenciación, Capital Humano, Finanzas y Escalabilidad, y Mercado y Crecimiento Comercial.\n- Lo escrito se guarda solo.\n- Ninguna vista ni respuesta del servicio trae precios.\n- «Enviar autodiagnóstico» pide confirmar, exige las ocho dimensiones calificadas y guarda la fecha de envío; con alguna sin calificar, el servidor responde 422 con las que faltan.\n- Un autodiagnóstico ya enviado no se edita ni se envía de nuevo (409) y el envío queda en la bitácora (<code>AUTODIAGNOSTICO_ENVIADO<\/code>).<\/p>\n<p>Cubre: autodiagnóstico en ocho dimensiones sin precios (FR095), envío del autodiagnóstico (FR124). Depende de: H-6.4.<\/p>\n<h4>H-12.2 Diagnóstico oficial y aporte de expertos<\/h4>\n<p>Es el diagnóstico que registra el Gestor GMA con el mismo formulario y el aporte del grupo de expertos. Sirve para tener la mirada oficial junto a la de la entidad.<\/p>\n<p>Como Gestor GMA, quiero registrar el diagnóstico oficial y el aporte de los expertos, para calcular las brechas.<\/p>\n<p>De dónde sale: PRD («Diagnóstico»), UX («Diagnóstico oficial»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#diag-gestor\">Ver la pantalla<\/a>.<\/p>\n<p>Servicios: <code>PUT /api/diagnostico/{entidad}/oficial<\/code> y <code>PUT /api/diagnostico/{entidad}/aporte-expertos<\/code>, permiso <code>diagnostico:oficial<\/code>.<\/p>\n<p>Cómo se sabe que está lista:\n- Con un autodiagnóstico enviado, el Gestor diligencia el mismo formulario y puede guardar un borrador; sin envío, el servidor responde 409 (FR124).\n- El aporte del grupo de expertos queda a nombre del Gestor; los expertos no tienen usuario.\n- Un Gestor solo abre las entidades que le corresponden: sin asignación, el servidor responde 403 (FR123). Hasta que se una H-3.6, la asignación sale de una tabla provisional con datos de prueba ficticios (NFR019).<\/p>\n<p>Cubre: diagnóstico oficial (FR096), aporte de expertos (FR097), entidades del Gestor (FR123), envío previo (FR124). Depende de: H-12.1.<\/p>\n<h4>H-12.3 Delta e informe de brechas<\/h4>\n<p>Es el cálculo de la diferencia por dimensión y el informe de brechas con sus servicios de Campus. Sirve para decidir qué atender primero.<\/p>\n<p>Como beneficiario, quiero ver mis brechas y los servicios que las atienden, para entender la propuesta.<\/p>\n<p>De dónde sale: PRD («Diagnóstico»), UX («Informe de brechas»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#brechas\">Ver la pantalla<\/a>.<\/p>\n<p>Servicio: <code>GET /api/diagnostico/{entidad}/brechas<\/code>, permiso <code>diagnostico:ver-brechas<\/code>; la respuesta del beneficiario no tiene campos de precio.<\/p>\n<p>Cómo se sabe que está lista:\n- Con 3 de autodiagnóstico y 2 del Gestor, el delta es 1; la fórmula es autodiagnóstico menos diagnóstico del Gestor.\n- El informe muestra por dimensión la criticidad (alta, media o baja, con escala y umbrales como supuesto) y los servicios de Campus que la atienden.\n- El beneficiario lo ve sin precios.\n- Una prueba cubre el cálculo del delta.<\/p>\n<p>Cubre: delta por dimensión (FR098), informe de brechas sin precios (FR099), pruebas de cálculos (NFR012). Depende de: H-12.2.<\/p>\n<h4>H-13.1 Bolsa y hojas de ruta de un beneficiario<\/h4>\n<p>Es la vista del tope, lo aprobado y lo disponible de un beneficiario, y la división en hojas. Sirve para que el Gestor reparta las brechas en hojas que se firman por separado.<\/p>\n<p>Como Gestor GMA, quiero ver la bolsa y dividir la atención en hojas, para firmar por partes.<\/p>\n<p>De dónde sale: PRD («Hoja de ruta»), UX («Hojas de ruta»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#hojas\">Ver la pantalla<\/a>.<\/p>\n<p>Servicios: <code>GET /api/beneficiarios/{id}/hojas<\/code> y <code>POST /api/beneficiarios/{id}/hojas<\/code>, permiso <code>hojas:administrar<\/code>.<\/p>\n<p>Cómo se sabe que está lista:\n- Ve el tope de su tipología, lo aprobado y lo disponible, en una sola bolsa que suma Ceiba y Connect.\n- Con seis brechas, el Gestor las agrupa en dos hojas y cada una se firma por separado.\n- Cada hoja descuenta lo aprobado, no lo ejecutado.\n- Un Gestor solo ve los beneficiarios que le corresponden (FR123).<\/p>\n<p>Cubre: división en hojas (FR102), bolsa única por beneficiario (FR106), entidades del Gestor (FR123). Depende de: H-12.3, H-11.4, H-3.6.<\/p>\n<h4>H-13.3 Límites de valor y tope de la bolsa<\/h4>\n<p>Es la validación de cada ficha contra el catálogo vigente, el rango de tarifa y el tope de la tipología. Sirve para que nadie apruebe más de lo permitido, aunque dos hojas se guarden a la vez.<\/p>\n<p>Como Gestor GMA, quiero que el sistema rechace una ficha que no cabe, para no pasarme del tope.<\/p>\n<p>De dónde sale: PRD («Hoja de ruta»), UX («Hojas de ruta»), decisión D12.<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#hojas-ficha-error\">Ficha con valor no permitido<\/a>.<\/p>\n<pre><code class=\"language-mermaid\">flowchart TD\n  a[&quot;Ficha con valor&quot;] --&gt; b{&quot;¿Cabe en el precio o rango del catálogo vigente?&quot;}\n  b --&gt;|no| x[&quot;No se guarda y explica el motivo&quot;]\n  b --&gt;|sí| c{&quot;¿La bolsa, con esta ficha, pasa el tope?&quot;}\n  c --&gt;|sí| x\n  c --&gt;|no| d[&quot;Se guarda y se descuenta lo aprobado&quot;]\n<\/code><\/pre>\n<p>Cómo se sabe que está lista:\n- Con un precio de catálogo de 10 millones, una ficha de 11 no se guarda.\n- Con un rango de 5 a 8 millones, una ficha de 9 no se guarda; el tope se compara sin IVA y los valores en dólares o euros se pasan a pesos con la tasa del día, que se guarda.\n- Con 45 millones aprobados en un beneficiario EAI, una ficha que suma 6 se rechaza.\n- Al guardar se bloquea la fila de la bolsa para que dos hojas simultáneas no pasen el tope.\n- Se muestran los dos motivos cuando fallan ambas reglas.<\/p>\n<p>Cubre: valor máximo según el catálogo (FR103), tope por tipología (FR104), tarifa por rango, IVA y moneda (FR105), pruebas de cálculos (NFR012). Depende de: H-13.2.<\/p>\n<h4>H-13.4 La hoja según el rol, sin precios para quien no debe verlos<\/h4>\n<p>Es la vista de la hoja de ruta para el beneficiario, el integrador y Gestión presupuestal, con una respuesta distinta por rol. Sirve para que los precios nunca lleguen al navegador de quien no los debe ver.<\/p>\n<p>Como beneficiario, quiero ver mi hoja sin precios; como integrador, quiero ver solo mis servicios con sus precios, para trabajar sin ver lo ajeno.<\/p>\n<p>De dónde sale: PRD («Hoja de ruta»), UX («Hoja de ruta (beneficiario)», «Mis servicios en las hojas de ruta»), decisión 0007.<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#hoja-ben\">Hoja del beneficiario<\/a> y <a href=\"../ux/prototipo.html#hoja-int\">servicios del integrador<\/a>.<\/p>\n<p>Servicio: <code>GET /api/hojas/{id}<\/code>, permiso <code>hojas:ver<\/code>. Cada vista tiene su propia clase de respuesta; la del beneficiario no tiene campo de precio. Ejemplo para un beneficiario:<\/p>\n<pre><code class=\"language-json\">{ &quot;hoja&quot;: &quot;HR-0001&quot;, &quot;etapaFirma&quot;: 3,\n  &quot;servicios&quot;: [ { &quot;nombre&quot;: &quot;Diagnóstico digital&quot;, &quot;prestador&quot;: &quot;Ceiba&quot;, &quot;meta&quot;: &quot;Mapa de procesos&quot;, &quot;indicador&quot;: &quot;1 informe&quot; } ] }\n<\/code><\/pre>\n<p>Para un integrador, el mismo servicio agrega <code>\"valor\": 8000000<\/code> y solo trae los servicios de su entidad.<\/p>\n<p>Cómo se sabe que está lista:\n- Un beneficiario o un integrador ajeno abre la hoja y la respuesta del servidor no incluye precios ni servicios que no le corresponden.\n- Gestión presupuestal ve todo.\n- La prueba de contrato revisa el JSON, el Excel y el PDF de cada rol y falla si aparece un campo o una cifra de precio.\n- El beneficiario puede comentar cada ficha.<\/p>\n<p>Cubre: la hoja según el rol (FR107), precios filtrados en el servidor (NFR018), 401 y 403 por rol (NFR001). Depende de: H-13.2.<\/p>", "spec_html": "<h2>Datos y su clasificación<\/h2>\n<table>\n<thead>\n<tr>\n<th>Dato<\/th>\n<th>Clase<\/th>\n<th>Quién lo ve<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Convocatorias, términos, cronograma<\/td>\n<td>Pública<\/td>\n<td>Cualquier persona<\/td>\n<\/tr>\n<tr>\n<td>Catálogo con precios, hoja de ruta completa<\/td>\n<td>Reservada<\/td>\n<td>ATENEA interno; integrador, lo suyo<\/td>\n<\/tr>\n<tr>\n<td>Hoja sin precios, brechas, autodiagnóstico, plan e hitos<\/td>\n<td>Clasificada<\/td>\n<td>Entidad beneficiaria y su Gestor GMA<\/td>\n<\/tr>\n<tr>\n<td>Usuarios (con documento y correo), IP, sexo del representante legal<\/td>\n<td>Datos personales<\/td>\n<td>Por rol, con aviso Ley 1581; usuarios, documento y correo solo con <code>usuarios:listar<\/code><\/td>\n<\/tr>\n<tr>\n<td>Antecedentes, SARLAFT, documento de identidad<\/td>\n<td>Datos personales<\/td>\n<td>Gerencia CTeI, Enlace SARLAFT, Comité<\/td>\n<\/tr>\n<tr>\n<td>Bitácora, firmas y sellos<\/td>\n<td>Clasificada<\/td>\n<td>Lectura por rol; nadie edita ni borra<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Se conservan 10 años y ninguna tarea automática los borra antes (NFR005).<\/li>\n<li>Los usuarios, con su documento y su correo, viven en la tabla <code>usuario_perfil<\/code> (<code>V3_01<\/code>, H-3.1, PR #14): usuario, documento, correo, entidad y entidad padre como texto hasta que H-3.2 las normalice, activo y secciones. Solo los roles con el permiso <code>usuarios:listar<\/code> ven la lista completa.<\/li>\n<li>Registro público (H-2.6, TK-17, PR #25, <code>V3_06<\/code>): <code>usuario_perfil<\/code> gana <code>tipo_persona<\/code> (JURIDICA o NATURAL) y <code>datos_autorizados_en<\/code> (fecha en que la persona autorizó el uso de sus datos, NFR003). Ambas quedan nulas para quien crea un administrador. La migración es de la serie 3 porque altera una tabla que crea <code>V3_01<\/code>. Documento y correo siguen siendo dato personal.<\/li>\n<li>El selector de otras pantallas (<code>GET /api/usuarios/selector<\/code>) devuelve solo usuario y entidad, máximo 20 y solo activos.<\/li>\n<li>Cifrado en reposo (NFR004): cifrado de la base y del almacenamiento de archivos que provea ATENEA (supuesto SUP20). Si no lo ofrece, se cifran los archivos de la Gerencia CTeI desde la aplicación. La decisión 0012, sobre TLS y cifrado en reposo en la plataforma, debe citarse aquí; no está en <code>docs/decisiones/<\/code> de main y queda pendiente de subir (ver «Preguntas abiertas»).<\/li>\n<li>Formularios (H-4.1, PR #18, <code>V4_02<\/code>, módulo <code>campus/formulario<\/code>): <code>formulario<\/code> (con mensajes de bienvenida y despedida), <code>formulario_seccion<\/code> (secciones numeradas) y <code>formulario_pregunta<\/code> (código, texto, tipo TEXTO, NUMERO, FECHA u OPCION, obligatoria y orden). La estructura es provisional: el PRD no define la estructura real de las preguntas (ver «Preguntas abiertas»). El permiso <code>formularios:administrar<\/code> va a <code>campus:administrador<\/code>.<\/li>\n<li>Plantilla .xlsx por sección: la celda B1 trae el id del formulario, la B2 el número de sección, el encabezado va en la fila 4 y las preguntas desde la fila 5 (máximo 500). La carga valida todo y rechaza el archivo completo si hay un error («Fila N: …»). Actualiza por código y agrega las nuevas, sin borrar las que no vienen en el archivo.<\/li>\n<li>Archivos (H-4.3, PR #19, <code>V4_03<\/code>, <code>transversal/archivos<\/code>): el servicio común <code>ArchivoService<\/code> oculta dónde viven. Hoy guarda un BLOB en la tabla <code>archivo<\/code> (nombre, tipo, tamaño y huella SHA-256), porque ATENEA no ha definido el almacenamiento (P-40). Acepta pdf, doc, docx, xls, xlsx, png, jpg, jpeg y gif de hasta 10 MB, y valida la extensión y los primeros bytes del formato. El multipart de Spring queda en 11 MB por archivo y 12 MB por petición, para que el rechazo lo dé el servicio con su mensaje y no Tomcat. Cuando ATENEA responda P-40 se cambia solo la implementación del servicio.<\/li>\n<li>Datos históricos (H-4.3, <code>campus/convocatoria<\/code>): tabla <code>dato_historico<\/code>, una fila por año y mes, con su archivo pedido a <code>ArchivoService<\/code>. API: <code>GET<\/code> y <code>POST /api/historicos<\/code>, <code>PUT /api/historicos/{AAAA-MM}<\/code> y <code>GET /api/historicos/{AAAA-MM}/archivo<\/code>. Un periodo repetido da 409. Solo acepta .xlsx de hasta 10 000 KB. El permiso <code>historicos:administrar<\/code> va a <code>campus:administrador<\/code> y <code>campus:administrador-campus<\/code>.<\/li>\n<li>Integradores (H-3.4, PR #20, <code>V3_05<\/code>): la tabla <code>usuario_integrador<\/code> tiene una fila por usuario. <code>usuario<\/code> es la llave primaria y una llave foránea a <code>usuario_perfil<\/code>; <code>integrador<\/code> es CEIBA o CONNECT; <code>habilitado_en<\/code> en nulo significa que la persona aún no está habilitada. El permiso <code>usuarios:habilitar-integrador<\/code> va solo a <code>campus:administrador-campus<\/code>, y el realm local trae ese rol para la prueba de arranque.<\/li>\n<li>Fecha límite de los formularios (H-6.1, TK-14, PR #22): la columna <code>formulario.cronograma_id<\/code> liga cada formulario a un cronograma, y de ahí toma su fecha límite. La semilla liga «Caracterización de la entidad» a su cronograma de formulario y «Postulación Campus 2600» al de la convocatoria.<\/li>\n<li>Respuestas de formularios (H-6.1, TK-14): la tabla <code>formulario_respuesta<\/code> guarda entidad, <code>pregunta_id<\/code> y valor, con llave primaria entidad más pregunta. Es provisional. <code>V6_02<\/code> (H-6.4, TK-18) le agrega <code>guardado_en<\/code> y <code>guardado_por<\/code>; <code>valor<\/code> sigue siendo texto (VARCHAR2 de 4000, que cuenta bytes y no caracteres). La estructura real de las preguntas sigue abierta para Diego y el PRD (ver «Preguntas abiertas»).<\/li>\n<li>Finalización (H-6.5, TK-19, PR #27, <code>V6_05<\/code>): la tabla <code>formulario_finalizacion<\/code> guarda <code>entidad<\/code>, <code>formulario_id<\/code>, <code>finalizado_en<\/code>, <code>finalizado_por<\/code> e <code>ip<\/code>. La llave primaria es entidad más formulario, así que la base impide finalizar dos veces. El hecho va también a la bitácora como <code>FORMULARIO_FINALIZADO<\/code>. La IP es dato personal (Ley 1581). La numeración es por épica (D15): <code>V6_03<\/code> es de H-6.3 (reglas de los formularios) y <code>V6_05<\/code> es de H-6.5 (esta historia).<\/li>\n<li>Reglas de los formularios (H-6.3, TK-20, PR #28, <code>V6_03<\/code>): tres tablas con esquema provisional. No hay reglas sembradas, las preguntas se nombran por código y las secciones por número.<\/li>\n<li><code>formulario_regla<\/code>: el tipo de regla (los 18 de <code>TipoRegla<\/code> del sistema anterior), el origen, el destino (una pregunta o una sección), el umbral, <code>valor_condicion<\/code> y el número de ciclo.<\/li>\n<li><code>formulario_pregunta_config<\/code>: la forma de la pregunta (SIMPLE, MATRIZ o SUMATORIA), las columnas y las opciones separadas por «|», el ciclo y las filas mínimas y máximas.<\/li>\n<li><code>formulario_sumando<\/code>: las preguntas que entran en una sumatoria.<\/li>\n<li>Todo queda detrás de un solo servicio, para cambiarlo cuando Diego confirme el esquema y ATENEA entregue las reglas reales (ver «Preguntas abiertas»).<\/li>\n<li>Autodiagnóstico (H-12.1, TK-24, <code>V12_01<\/code>): la tabla <code>autodiagnostico_calificacion<\/code> guarda <code>entidad<\/code>, <code>dimension<\/code>, <code>calificacion<\/code>, <code>guardado_en<\/code> y <code>guardado_por<\/code>. La llave primaria es entidad más dimensión. Dos <code>CHECK<\/code> impiden una calificación fuera de 1 a 4 y una dimensión que no sea una de las ocho oficiales. Es dato clasificado y no trae precios.<\/li>\n<li>Envío del autodiagnóstico (TK-23, por construir): tabla propia <code>autodiagnostico_envio<\/code> con <code>entidad<\/code> como llave primaria, <code>enviado_en<\/code> y <code>enviado_por<\/code>, en la siguiente migración libre de la serie 12 (D15). Se elige tabla y no columna porque las calificaciones son ocho filas por entidad, y una columna repetiría el estado ocho veces. Con la llave por entidad, la base impide enviar dos veces, igual que <code>formulario_finalizacion<\/code>.<\/li>\n<li>Asignación de gestores (TK-22, H-3.6, en main): la tabla <code>gestor_entidad<\/code> guarda <code>gestor<\/code>, <code>entidad<\/code>, <code>asignado_por<\/code> y <code>asignado_en<\/code>, con llave primaria gestor más entidad. Es dato clasificado: dice qué entidades atiende cada Gestor. La entidad usa la misma llave que <code>formulario_respuesta<\/code> y <code>formulario_finalizacion<\/code>. La tabla provisional de T-12.2.1 ya tiene este nombre: <code>V12_04<\/code> la ajusta: agrega <code>asignado_por<\/code> y <code>asignado_en<\/code>, marca como del sistema las filas provisionales y no la recrea. Va después de la provisional <code>V12_02<\/code>, porque ninguna migración puede depender de otra posterior (D15).<\/li>\n<li>Tipos de pregunta (H-6.2, TK-15, PR #23): la interfaz dibuja ocho, TEXTO, NUMERO, DECIMAL, FECHA, SELECCION_UNICA, SELECCION_MULTIPLE, DIRECCION y ARCHIVO. <code>V4_02<\/code> solo conoce cuatro: TEXTO, NUMERO, FECHA y OPCION. Los cuatro nuevos viven solo en el frontend (<code>features/formularios/preguntas<\/code>) y en el validador; ninguna columna ni migración los guarda.<\/li>\n<li>Decimal (H-6.2, TK-15): el valor se guarda como número (12,5 llega como 12.5) y la interfaz lo muestra con coma.<\/li>\n<li>Convocatorias (H-7.1, TK-16, PR #24, <code>V7_01<\/code>, módulo <code>campus/convocatoria<\/code>): cuatro tablas. Las reglas de topes, cupos, subcriterios y empate son parámetros de cada convocatoria (D11).<\/li>\n<li><code>tipologia<\/code>: <code>codigo<\/code>, <code>nombre<\/code>, <code>tope_millones<\/code> y <code>orden<\/code>. Se siembra con EBCT en 120, EAI en 50 y MIPYMES en 25; GRANDES queda sin tope y lo escribe cada convocatoria.<\/li>\n<li><code>convocatoria<\/code>: el nombre es único sin importar mayúsculas; los evaluadores van de 1 a 20; trae <code>subcriterios_paso1<\/code> y <code>terminos<\/code>; <code>formulario_id<\/code> y <code>cronograma_id<\/code> son opcionales.<\/li>\n<li><code>convocatoria_tipologia<\/code>: tope y cupos de cada tipología en cada convocatoria. Si una tipología tiene tope fijo, el servicio rechaza la entrada que lo cambie.<\/li>\n<li><code>convocatoria_empate<\/code>: los criterios técnicos de empate, en orden y sin repetir.<\/li>\n<li>El permiso <code>convocatorias:administrar<\/code> va a <code>campus:administrador-campus<\/code> y <code>campus:lider-convocatoria<\/code>.<\/li>\n<li>Portal público (H-7.2, TK-25, PR #30, <code>V7_02<\/code>): dos tablas nuevas en <code>campus/convocatoria<\/code>, porque <code>V7_01<\/code> no tenía dónde guardar inquietudes ni actos.<\/li>\n<li><code>inquietud<\/code>: <code>convocatoria_id<\/code>, <code>nombre<\/code>, <code>correo<\/code>, <code>texto<\/code> (CLOB) y <code>recibida_en<\/code>. Nombre y correo son datos personales (Ley 1581).<\/li>\n<li><code>convocatoria_acto<\/code>: <code>convocatoria_id<\/code>, <code>titulo<\/code> y <code>publicado_en<\/code>. No hay pantalla de carga: hoy se llena por la base.<\/li>\n<li>Diagnóstico oficial (H-12.2, TK-26, PR #31, <code>V12_02<\/code>): tres tablas en <code>campus/hojaderuta<\/code>. Es dato clasificado y no trae precios.<\/li>\n<li>Comentarios de la ficha (H-13.4, PR #63, <code>V13_04<\/code>, por unirse): tabla <code>comentario_ficha<\/code>, ligada a <code>hoja_servicio<\/code> (<code>hoja_servicio_id<\/code>), con <code>autor<\/code>, <code>texto<\/code> (hasta 1000 caracteres, sin texto vacío) y <code>creado_en<\/code>. Solo el beneficiario de la entidad dueña de la hoja escribe en ella.<\/li>\n<li><code>diagnostico_oficial<\/code>: <code>entidad<\/code>, <code>aporte_expertos<\/code> (CLOB, texto general de hasta 4000 caracteres), <code>aporte_guardado_en<\/code> y <code>aporte_guardado_por<\/code>, <code>emitido_en<\/code> y <code>emitido_por<\/code>. El usuario sale siempre del token.<\/li>\n<li><code>diagnostico_oficial_calificacion<\/code>: <code>entidad<\/code>, <code>dimension<\/code>, <code>calificacion<\/code> (1 a 4), <code>guardado_en<\/code> y <code>guardado_por<\/code>.<\/li>\n<li>\n<p><code>gestor_entidad<\/code> provisional: <code>gestor<\/code> y <code>entidad<\/code>. H-3.6 la ajusta y no cambia el servicio de consulta (TK-22).<\/p>\n<\/li>\n<li>\n<p>Caracterización de la entidad (H-11.1, <code>V11_02<\/code>, <code>campus/catalogo<\/code>): la tabla <code>caracterizacion<\/code> y los permisos <code>caracterizacion:enviar<\/code> y <code>caracterizacion:validar<\/code> llegan en esa migración. Es dato clasificado de la entidad.<\/p>\n<\/li>\n<li>Revisión SARLAFT (H-9.3, PR #60, <code>V9_08<\/code>, por unirse): la tabla <code>sarlaft_revision<\/code> se mantiene sincronizada con <code>postulacion.estado_sarlaft<\/code>. La regla de quién ve estos datos sigue pendiente con la persona.<\/li>\n<li>Carta de formalización (H-10.1, <code>V10_01<\/code>, PR #73, por unirse): tabla <code>carta_formalizacion<\/code>. Su clase de dato depende de lo que guarde la carta firmada (ver «Preguntas abiertas»). H-10.2 (<code>V10_03<\/code>, PR #77, por unirse) agrega a la misma tabla <code>estado<\/code>, <code>subsanaciones<\/code>, <code>motivo_subsanacion<\/code> (VARCHAR2(500 CHAR), para que el límite cuente caracteres y no bytes), <code>validada_por<\/code> y <code>validada_en<\/code>.<\/li>\n<li>Panel de asignación (H-9.5, PR #56, <code>V9_03<\/code>, por unirse): cuatro tablas.<\/li>\n<li><code>festivo_colombia<\/code>: los festivos del calendario colombiano, que el cálculo de días hábiles de la citación usa.<\/li>\n<li><code>panel_estado<\/code>: el estado de cada postulación dentro del panel.<\/li>\n<li><code>panel_voto<\/code>: los votos registrados por postulación.<\/li>\n<li><code>panel_citacion<\/code>: las citaciones enviadas al panel.<\/li>\n<li>Estados de la postulación (H-8.3, <code>V8_04<\/code>, <code>campus/postulacion<\/code>): <code>estado_postulacion<\/code> guarda 14 estados en <code>V8_04<\/code>; EN_FORMALIZACION (TK-40) llega en <code>V10_02<\/code> y suma 15. <code>transicion_postulacion<\/code> guarda qué estado puede pasar a cuál, según D11. La postulación gana la columna <code>estado_sarlaft<\/code>.<\/li>\n<li>Cierre del servicio (H-15.3, PR #78, <code>V15_03<\/code>, por unirse): dos tablas con una fila por servicio. <code>conformidad_servicio<\/code> guarda la conformidad del beneficiario (<code>conformidad_en<\/code>, <code>conformidad_por<\/code>). <code>cierre_servicio<\/code> guarda el cierre del Gestor GMA (<code>cerrado_en<\/code>, <code>cerrado_por<\/code>, <code>prestado<\/code> y <code>acta_archivo_id<\/code>) y tiene llave foránea a <code>conformidad_servicio<\/code> y a <code>archivo<\/code>. Ambas usan <code>servicio_id<\/code> como llave primaria, así la base impide repetir cada paso. Es dato clasificado de la entidad.<\/li>\n<li>Avance por beneficiario (H-15.4, PR #83, <code>V15_04__avance_por_beneficiario.sql<\/code>, por unirse): la migración da los tres permisos de alcance y su asignación a roles (ver «Permisos y menús»). El avance (servicios terminados y prestados por entidad) se lee de <code>cierre_servicio<\/code>, que ya es dato clasificado de la entidad; no hay fila nueva en esta tabla.<\/li>\n<\/ul>"}, {"n": 12, "titulo": "Firmas y PDF sellado", "roles": ["Integrador", "Gerente GMA", "Director"], "prd": ["### Firmas"], "historias": ["H-14.1", "H-14.2", "H-14.4", "H-14.6"], "spec": ["## Módulos"], "resumen": "La hoja de ruta se firma en cuatro etapas; con todas las firmas se genera un PDF oficial sellado que cualquiera puede verificar.", "usuarios": "qa.gerente-gma, qa.director-general", "video": "videos/cap12.mp4", "vtt": "WEBVTT\n\n1\n00:00:03.100 --> 00:00:05.093\nCapítulo doce.\n\n2\n00:00:05.043 --> 00:00:08.468\nEl circuito de firmas y el PDF sellado.\n\n3\n00:00:09.070 --> 00:00:20.400\nLa hoja de ruta se firma en cuatro etapas: gestión presupuestal, representante legal, integradores con el gerente GMA, y por último el director general.\n\n4\n00:00:20.968 --> 00:00:27.793\nEl gerente GMA entra y su inicio le avisa que falta su firma en la hoja HR cero cero cero uno.\n\n5\n00:00:28.354 --> 00:00:34.892\nAl abrirla ve el circuito: qué etapas están completas, cuál está en curso y quién falta.\n\n6\n00:00:35.452 --> 00:00:39.932\nLos integradores firman en la misma etapa, en paralelo.\n\n7\n00:00:39.882 --> 00:00:45.130\nCuando todas las firmas están, Hēma genera el PDF oficial con un sello.\n\n8\n00:00:45.742 --> 00:00:53.790\nCualquiera de los firmantes puede comprobar un PDF en Verificar un PDF: Hēma confirma si coincide con el sello guardado.\n\n9\n00:00:54.352 --> 00:00:58.650\nEl director general firma al final, desde Por firmar.\n\n", "prd_html": "<h3>Firmas<\/h3>\n<ul>\n<li>FR108. La hoja de ruta se firma en cuatro etapas en orden: Gestión presupuestal, representante legal de la entidad o persona natural, integradores con el Líder o Gerente GMA, y Director General.\n  Criterio: dado una hoja en etapa 2, cuando el Director General intenta firmar, entonces el sistema lo impide. (R-28; XL2 P-20)<\/li>\n<li>FR109. En la etapa 3 firman en paralelo los representantes legales de los integradores con servicios en la hoja y el Líder o Gerente GMA, sin orden entre ellos. La etapa 4 se abre cuando todos firmaron.\n  Criterio: dado una hoja solo con servicios de Ceiba, cuando se abre la etapa 3, entonces Connect no firma. (R-28; XL2 P-20)<\/li>\n<li>FR110. Cada firma guarda usuario, fecha, hora, IP y aceptación de términos.\n  Criterio: dado una firma, cuando se consulta su registro, entonces trae los cinco datos. (R-29; XL2 P-20)<\/li>\n<li>FR111. Cualquier firmante devuelve la hoja con observaciones obligatorias y el circuito se reinicia desde la etapa 1.\n  Criterio: dado una devolución en la etapa 3, cuando se registra, entonces las firmas previas dejan de valer y Gestión presupuestal vuelve a firmar. (R-30; XL2 P-20; C-31)<\/li>\n<li>FR112. Al completar las cuatro etapas, el sistema genera un PDF inmutable con identificador y sello SHA-256, y congela la hoja.\n  Criterio: dado una hoja firmada, cuando alguien intenta editarla, entonces el sistema lo impide. (R-31, R-29; NFR009)<\/li>\n<li>FR113. El beneficiario y su representante ven y firman una versión de la hoja sin precios (SUP17). El PDF sin precios lleva el identificador de la hoja y el sello de la versión completa, que es la oficial.\n  Criterio: dado un beneficiario, cuando descarga el PDF, entonces no contiene precios y muestra el identificador y el sello oficial. (R-27, R-28, R-31; P-50)<\/li>\n<li>FR114. Cualquier persona autorizada puede comprobar que un PDF coincide con su sello.\n  Criterio: dado un PDF alterado, cuando se verifica, entonces el sistema dice que no coincide. (R-29, R-31)<\/li>\n<\/ul>", "historia_html": "<h4>H-14.1 Circuito de firmas y hojas pendientes<\/h4>\n<p>Es el circuito de cuatro etapas y la lista de hojas pendientes de cada firmante. Sirve para que cada persona firme solo cuando le toca.<\/p>\n<p>Como firmante, quiero ver mis hojas pendientes y si es mi turno, para firmar en el orden correcto.<\/p>\n<p>De dónde sale: PRD («Firmas»), UX («Hojas pendientes de mi firma», «Firmas»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#fir-inicio\">Hojas pendientes<\/a>, <a href=\"../ux/prototipo.html#firma-fuera-turno\">todavía no es su turno<\/a> y <a href=\"../ux/prototipo.html#firmas\">firmas del beneficiario<\/a>.<\/p>\n<pre><code class=\"language-mermaid\">flowchart TD\n  e1[&quot;1 Gestión presupuestal&quot;] --&gt; e2[&quot;2 Representante legal&quot;]\n  e2 --&gt; e3[&quot;3 Integradores y Gestor GMA, en paralelo&quot;]\n  e3 --&gt; e4[&quot;4 Director General&quot;]\n  e4 --&gt; pdf[&quot;PDF sellado&quot;]\n  dev[&quot;Devolver&quot;] -.-&gt; e1\n<\/code><\/pre>\n<p>Servicio: <code>GET /api/firmas/pendientes<\/code> y <code>GET /api/hojas/{id}/firmas<\/code>, permiso <code>firmas:ver<\/code>.<\/p>\n<p>Cómo se sabe que está lista:\n- Con una hoja en etapa 2, el Director General no puede firmar y ve que todavía no es su turno.\n- En la etapa 3 firman a la vez los representantes legales de los integradores con servicios en la hoja y el Líder o Gerente GMA; con una hoja solo de Ceiba, Connect no firma.\n- La etapa 4 se abre cuando todos firmaron.\n- Una hoja que no le toca abre un aviso y el botón queda bloqueado.<\/p>\n<p>Cubre: cuatro etapas en orden (FR108), etapa 3 en paralelo (FR109), etapa de firma y quién falta en una pantalla (UX-DR005). Depende de: H-13.3, H-13.4.<\/p>\n<h4>H-14.2 Firmar la hoja<\/h4>\n<p>Es la firma con confirmación y términos, que guarda lo necesario para probarla. Sirve para dejar constancia de quién firmó y desde dónde.<\/p>\n<p>Como firmante, quiero firmar con una confirmación clara, para dejar mi firma registrada.<\/p>\n<p>De dónde sale: PRD («Firmas»), UX («Hoja de ruta para firmar»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#firmar\">Hoja para firmar<\/a> y <a href=\"../ux/prototipo.html#firmar-confirmar\">confirmar firma<\/a>.<\/p>\n<p>Servicio: <code>POST /api/hojas/{id}/firma<\/code>, permiso <code>firmas:firmar<\/code>; el usuario sale del token.<\/p>\n<p>Cómo se sabe que está lista:\n- Firmar pide confirmar y aceptar los términos, y aclara que se guardan usuario, fecha, hora e IP.\n- Cada firma queda en una tabla de solo agregar con usuario, fecha, hora, IP y aceptación de términos.\n- Firmar fuera de turno se rechaza en el servidor.\n- Ve solo los servicios y precios que su rol permite.<\/p>\n<p>Cubre: firma con cinco datos (FR110), confirmar antes de firmar (UX-DR010), firmas que no se editan (NFR010). Depende de: H-14.1.<\/p>\n<h4>H-14.4 PDF oficial sellado<\/h4>\n<p>Es la generación única del PDF de la hoja completa con su sello SHA-256 al cerrar la etapa 4. Sirve para tener un documento inmutable y comprobable.<\/p>\n<p>Como Director General, quiero que al firmar quede el PDF oficial con su sello, para que la hoja quede congelada.<\/p>\n<p>De dónde sale: PRD («Firmas»), UX («Hoja de ruta firmada»), decisión 0008.<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#firma-completa\">Ver la pantalla<\/a>.<\/p>\n<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor D as Director General\n  participant A as API\n  participant J as JasperReports\n  participant S as Sello SHA-256\n  participant B as Base y archivos\n  D-&gt;&gt;A: firma la etapa 4\n  A-&gt;&gt;J: genera el PDF completo una sola vez\n  J--&gt;&gt;A: bytes del PDF\n  A-&gt;&gt;S: calcula el sello con el JDK\n  A-&gt;&gt;B: guarda PDF y sello, solo insertar\n  A--&gt;&gt;D: hoja firmada con identificador y sello\n<\/code><\/pre>\n<p>Cómo se sabe que está lista:\n- Al completar las cuatro etapas se genera un PDF con identificador y sello, se guarda y no se vuelve a generar.\n- La hoja queda congelada: intentar editarla se rechaza.\n- Una prueba cambia un byte del PDF y comprueba que el sello es otro.\n- El PDF completo solo lo descargan los roles que ven precios.<\/p>\n<p>Cubre: PDF inmutable con identificador y sello, hoja congelada (FR112), sello calculado sobre los bytes (NFR009), PDF firmado que no se edita (NFR010). Depende de: H-14.2, H-1.5.<\/p>\n<h4>H-14.6 Verificar un PDF<\/h4>\n<p>Es la pantalla para subir un PDF y saber si coincide con el sello guardado. Sirve para detectar copias alteradas.<\/p>\n<p>Como persona autorizada, quiero subir un PDF y saber si es el oficial, para confiar en él.<\/p>\n<p>De dónde sale: PRD («Firmas»), UX («Verificar un PDF»).<\/p>\n<p>Diseño: <a href=\"../ux/prototipo.html#firma-verificar\">Verificar<\/a>, <a href=\"../ux/prototipo.html#firma-verificar-ok\">el PDF coincide<\/a> y <a href=\"../ux/prototipo.html#firma-verificar-error\">no coincide<\/a>.<\/p>\n<p>Servicio: <code>POST /api/firmas/verificacion<\/code>, permiso <code>firmas:verificar<\/code>. Recibe un PDF y responde, por ejemplo, <code>{\"coincide\":true,\"hoja\":\"HR-0001-v1\",\"version\":\"oficial\"}<\/code>; si no coincide, <code>{\"coincide\":false}<\/code>.<\/p>\n<p>Cómo se sabe que está lista:\n- Un PDF intacto muestra que coincide con el sello de la hoja, sea el oficial o el de sin precios.\n- Un PDF con un solo byte cambiado muestra que no coincide y que no debe usarse como oficial.<\/p>\n<p>Cubre: comprobar que un PDF coincide con su sello (FR114), sello de un byte (NFR009). Depende de: H-14.4.<\/p>", "spec_html": "<h2>Módulos<\/h2>\n<pre><code class=\"language-mermaid\">flowchart TD\n  acc[&quot;Acceso y roles&quot;] --&gt; conv[&quot;Convocatoria&quot;]\n  conv --&gt; post[&quot;Postulación, evaluación y formalización&quot;]\n  post --&gt; hoja[&quot;Diagnóstico y hoja de ruta&quot;]\n  cat[&quot;Catálogo&quot;] --&gt; hoja\n  hoja --&gt; firm[&quot;Firmas y sello&quot;]\n  firm --&gt; seg[&quot;Seguimiento&quot;]\n  tra[&quot;Bitácora, correo y archivos&quot;] -.-&gt; hoja\n<\/code><\/pre>\n<ul>\n<li>Bitácora, correo y archivos los usan todos los módulos. Un módulo no lee las tablas de otro: le pide el dato a su servicio (una prueba de arquitectura lo vigila). Cada módulo expone para eso un servicio de lectura, como <code>ConvocatoriaService.topeDe<\/code>, y los demás lo consumen (D20). Va detrás de un servicio propio (<code>RepositorioDeReglas<\/code>, <code>motor de reglas en<\/code> avalado por D19 y D02).<\/li>\n<li>Pantalla de inicio (H-16.1, PR #80, por unirse), en <code>transversal/inicio<\/code>. <code>GET /api/inicio<\/code> exige <code>inicio:ver<\/code>. Cada tarjeta la entrega un proveedor que implementa <code>ProveedorDeTarjetas<\/code>:<\/li>\n<li><code>HojasDelBeneficiarioProveedor<\/code> (<code>campus/hojaderuta<\/code>) exige <code>firmas:etapa-2<\/code> y usa <code>CircuitoDeFirmasService.hojasEnFirmaDe(entidad)<\/code>.<\/li>\n<li><code>FirmasPendientesProveedor<\/code> (<code>campus/hojaderuta<\/code>) exige <code>firmas:etapa-N<\/code> y enlaza a <code>/hojas-de-ruta/{id}/firmas<\/code>.<\/li>\n<li><code>PlanesPorAprobarProveedor<\/code> (<code>campus/seguimiento<\/code>) exige <code>planes:aprobar<\/code> y enlaza a <code>/plan-revision?servicio=N<\/code>.\n  Si el token no trae el permiso, el proveedor no entrega la tarjeta (D06). Los otros módulos se leen por sus servicios, no por sus tablas (D20).<\/li>\n<li>Convocatoria, roles y usuarios se escriben sin referencias a Campus para que BankPro los reutilice (NFR017).<\/li>\n<li>Reportes (H-5.1, TK-34, PR #42): el módulo transversal de reportes no lee tablas de Campus con <code>SELECT<\/code>. Cada módulo expone un servicio de lectura y el reporte lo consume, incluidos los reportes de H-5.3, H-5.4 y los que vienen después. El PR #42 se cambia a esa regla antes de unirse; hasta entonces sus lecturas directas no cuentan como aprobadas.<\/li>\n<li>Las siete funciones sin pantalla en UX (FR024, FR057, FR075, FR079, FR080, FR084, FR113) tienen servicio previsto en su módulo. Cuándo se les diseña pantalla lo decide el plan.<\/li>\n<li>Diligenciamiento (H-6.1, TK-14): <code>GET /api/formularios/{id}/diligenciamiento<\/code>, en <code>campus/formulario<\/code>. La entidad sale siempre del usuario del token (se busca en <code>usuario_perfil<\/code>) y nunca de la petición (D07).<\/li>\n<li>Validación de respuestas (H-6.2, TK-15, PR #23): <code>ValidadorDeRespuestas<\/code>, en <code>campus/formulario/service<\/code>. Aplica obligatoriedad, numérico, decimal, longitud, rango, expresión regular y número de opciones, con los mensajes de SPEC. Para el archivo exige el límite de 10 MB y los formatos de <code>transversal/archivos<\/code>. Aún no está conectado a ningún servicio: se conecta en H-6.4. Al conectarlo hay que limitar el costo de la expresión regular (ReDoS) y pasar el archivo por <code>ArchivoService<\/code>, para validar también los primeros bytes.<\/li>\n<li>Convocatorias (H-7.1, TK-16, PR #24): <code>ConvocatoriaService<\/code>, en <code>campus/convocatoria<\/code>. API: <code>GET /api/convocatorias<\/code>, <code>GET /api/convocatorias/{id}<\/code>, <code>GET /api/convocatorias/tipologias<\/code>, <code>POST /api/convocatorias<\/code> y <code>PUT /api/convocatorias/{id}<\/code>, todas con el permiso <code>convocatorias:administrar<\/code>. Crear y editar dejan registro en la bitácora (<code>CONVOCATORIA_CREADA<\/code> y <code>CONVOCATORIA_EDITADA<\/code>). <code>topeDe(convocatoria, tipologia)<\/code> entrega el tope que usará la hoja de ruta (H-13.3), para que ese módulo no lea las tablas de convocatoria.<\/li>\n<li>Diligenciamiento por sección (H-6.4, TK-18, PR #26): dos servicios en <code>campus/formulario<\/code>, ambos con el permiso <code>formularios:diligenciar<\/code> (solo <code>campus:beneficiario<\/code>). La entidad sale siempre del token, nunca de la petición (D07).<\/li>\n<li><code>GET /api/formularios/{id}/secciones/{numero}<\/code> devuelve las preguntas de la sección con lo ya guardado y la hora del último guardado, para poder volver otro día.<\/li>\n<li><code>PUT /api/formularios/{id}/respuestas<\/code> recibe <code>{seccion, respuestas: {codigo: valor}}<\/code> y guarda parcial: guarda lo válido, borra lo vacío y responde 200 con <code>{guardadoEn, errores: {codigo: mensaje}}<\/code>; lo inválido no se guarda, así un campo mal escrito no impide guardar el resto (FR053). No exige las obligatorias: se exigen al finalizar (H-6.5). Respeta el cierre del cronograma: con el plazo vencido responde 409 (<code>PlazoService.exigirAbierto<\/code>).<\/li>\n<li><code>GuardadoDeRespuestas<\/code> aplica esas reglas y <code>RepositorioDeRespuestas<\/code> es el único punto de acceso a las respuestas: ninguna otra clase lee ni escribe <code>formulario_respuesta<\/code>. Con eso el almacenamiento puede cambiar cuando Diego defina las preguntas.<\/li>\n<li>Bitácora: cada cambio por pregunta deja el evento <code>RESPUESTA_GUARDADA<\/code> en la bitácora existente, con valor anterior y nuevo escritos como «formulario N · sección M · código: valor». No hay tabla nueva: los códigos de pregunta solo son únicos dentro de una sección, y la bitácora ya guarda los dos valores.<\/li>\n<li>Interfaz: el panel de la sección monta <code>hm-pregunta<\/code> con las preguntas guardadas. TEXTO, NUMERO y FECHA se dibujan con su componente y OPCION como texto, porque <code>formulario_pregunta<\/code> no guarda las opciones. Guarda al salir del campo y cada 30 segundos.<\/li>\n<li>Finalización del formulario (H-6.5, TK-19, PR #27): <code>POST /api/formularios/{id}/finalizacion<\/code>, con el permiso <code>formularios:diligenciar<\/code> (solo <code>campus:beneficiario<\/code>), en la clase <code>FinalizacionDeFormulario<\/code> de <code>campus/formulario/service<\/code>. La entidad y el usuario salen del token (D07). Al finalizar aplica el motor de reglas (TK-21, PR #32), igual que al guardar; el guardado parcial usa los mismos datos (D09).<\/li>\n<li>Recibe <code>{aceptaTratamientoDeDatos}<\/code> y responde 200 con <code>{aceptadoEn, ip}<\/code>.<\/li>\n<li>422 con la lista de faltas (sección, nombre de sección, código, texto y mensaje) si hay obligatorias vacías o valores inválidos.<\/li>\n<li>422 sin faltas si no se aceptó el tratamiento de datos.<\/li>\n<li>409 si el formulario ya se envió, o si <code>PlazoService<\/code> dice que el plazo cerró.<\/li>\n<li>La interfaz no usa un endpoint de validación aparte: «Guardar y finalizar» guarda lo pendiente y finaliza con <code>aceptaTratamientoDeDatos=false<\/code>. Si no hay faltas, muestra el aviso de la Ley 1581 (datos conservados 10 años) y, al aceptar, repite con <code>true<\/code>. Así la validación queda solo en el servidor.<\/li>\n<li>Bloqueo: <code>GuardadoDeRespuestas<\/code> responde 409 (<code>FormularioFinalizadoException<\/code>) si la entidad ya finalizó ese formulario.<\/li>\n<li>Reglas de los formularios (H-6.3, TK-20, PR #28): <code>GET /api/formularios/{id}/reglas<\/code> entrega las reglas y la configuración de las preguntas de un formulario. Exige el permiso <code>formularios:diligenciar<\/code> y responde 404 si el formulario no existe. Aplica el motor en cada fase de diligenciamiento y de finalización (TK-21, PR #32), igual que al guardar; el guardado parcial usa los mismos datos (D09).<\/li>\n<li>Clases: <code>ReglasDeFormularioController<\/code> (controlador nuevo), <code>ReglasDeFormularioService<\/code> y <code>RepositorioDeReglas<\/code>, que lee las tablas de <code>V6_03<\/code>.<\/li>\n<li>Las reglas nombran las preguntas por código y las secciones por número. No hay reglas sembradas.<\/li>\n<li>Motor de reglas duplicado a propósito (H-6.3, TK-20): <code>MotorDeReglas<\/code> en el servidor (con <code>BigDecimal<\/code>) y <code>features/formularios/motor<\/code> en el frontend aplican la misma semántica. Un cambio en uno se hace también en el otro, con su prueba.<\/li>\n<li><code>HABILITA_*<\/code> oculta el destino hasta que la regla se cumple.<\/li>\n<li><code>DESHABILITA_PREGUNTA<\/code> y <code>DESHABILITA_SECCION<\/code> ocultan.<\/li>\n<li><code>DESHABILITA_POR_CONDICION<\/code> y <code>DESHABILITA_POR_SUMA_*<\/code> dejan el destino visible y deshabilitado. Si una pregunta queda oculta y deshabilitada a la vez, gana ocultar.<\/li>\n<li>Lo oculto no activa reglas ni suma.<\/li>\n<li>El cálculo se repite hasta que nada cambia, con un tope de vueltas.<\/li>\n<li>Los valores y sumatorias dependientes (<code>VALOR_DEPENDIENTE_*<\/code>, <code>SUMATORIA_DEPENDIENTE*<\/code>) solo devuelven violaciones, y solo si ambos lados tienen valor.<\/li>\n<li>En el panel, lo oculto no se dibuja, lo deshabilitado va en un <code>fieldset disabled<\/code> y las violaciones salen como error del campo.<\/li>\n<li>Límites conocidos (H-6.3, TK-20):<\/li>\n<li>El servidor aplica el motor al guardar y finalizar con los datos más recientes (TK-21, PR #32), incluidas las reglas que tocan varias secciones; el frontend espera las respuestas a que otro servicio las confirme. Queda un caso por pulir: cuando en la misma intentona se oculta una sección (una regla de la sección antes de guardar), conviene definir si repetir el motor o cerrar primero el lado que origina el ocultamiento.<\/li>\n<li>Ocultar una sección no oculta sus preguntas dentro del motor.<\/li>\n<li>Los códigos de pregunta solo son únicos dentro de una sección.<\/li>\n<li>El servidor no valida los límites de filas de matrices y ciclos.<\/li>\n<li>El panel todavía no dibuja matrices ni ciclos, porque <code>formulario_pregunta.tipo<\/code> solo admite TEXTO, NUMERO, FECHA y OPCION.<\/li>\n<li>Consulta de formularios entre entidades (H-6.6, TK-27, PR #35, <code>V6_06<\/code>, aún sin unir, en la rama h-6-6-consultar-el-formulario-de-otra): en <code>campus/formulario<\/code>. Es la única lectura de respuestas de otra entidad y la excepción a D07 para ese caso. Los dos permisos separan lo que cada rol ve.<\/li>\n<li><code>GET /api/formularios/{id}/respuestas?entidad=<\/code> con <code>formularios:consultar-otras<\/code> devuelve las respuestas de cualquier entidad, en solo lectura.<\/li>\n<li>Con <code>formularios:diligenciar<\/code> devuelve solo las de la propia entidad. Si el parámetro <code>entidad<\/code> no es la del token, responde 403.<\/li>\n<li><code>GET /api/formularios/consulta/usuarios<\/code> y <code>GET /api/formularios/consulta/formularios<\/code>, con <code>formularios:consultar-otras<\/code>, sirven para elegir la entidad y el formulario a consultar.<\/li>\n<li>El permiso <code>formularios:consultar-otras<\/code> lo asigna <code>V6_06<\/code> solo a <code>campus:administrador<\/code>, <code>campus:administrador-internacionalizacion<\/code> y <code>campus:administrador-campus<\/code>. Beneficiario e integrador no lo tienen.<\/li>\n<li>Interfaz: la sección del menú Formularios &gt; Consultar una entidad, con las rutas <code>/formularios/consultar<\/code> y <code>/formularios/:idFormulario/entidades/:idEntidad<\/code> (<code>docs/rutas.md<\/code>).<\/li>\n<li>Autodiagnóstico (H-12.1, TK-24): vive en <code>campus/hojaderuta<\/code>, porque no hay un módulo <code>diagnostico<\/code>. Exige el permiso <code>diagnostico:autoevaluar<\/code> (<code>campus:beneficiario<\/code>; el rol de prueba <code>campus:arranque-prueba<\/code> también lo trae).<\/li>\n<li><code>GET<\/code> y <code>PUT /api/diagnostico/autodiagnostico<\/code> devuelven <code>{dimensiones: [{codigo, nombre, calificacion}], guardadoEn}<\/code>. No hay campo de precio, así que no hay nada que ocultar. La entidad sale del token (D07).<\/li>\n<li>El <code>PUT<\/code> no exige las ocho dimensiones. Si una calificación no es un entero de 1 a 4, no guarda ninguna y responde 400: son ocho valores cerrados y el todo o nada es más simple que el guardado parcial de H-6.4.<\/li>\n<li>Cada cambio deja <code>AUTODIAGNOSTICO_GUARDADO<\/code> en la bitácora, escrito como «autodiagnóstico · Estrategia: 3». Si el valor no cambió, no escribe nada.<\/li>\n<li>No usa <code>PlazoService<\/code>: el autodiagnóstico no tiene cronograma.<\/li>\n<li>Las ocho dimensiones son el enum <code>Dimension<\/code>, no una tabla, porque son oficiales y fijas (FR095).<\/li>\n<li>Interfaz: ruta <code>/diagnostico/autodiagnostico<\/code>. Guarda al elegir, al salir del campo y cada 30 segundos. Quedaron fuera el botón «Enviar autodiagnóstico» del prototipo y la entrada al menú del beneficiario; los cubre TK-23.<\/li>\n<li>Envío del autodiagnóstico (TK-23, FR124, por construir, unas 3 h dentro de H-12.1):<\/li>\n<li><code>POST /api/diagnostico/autodiagnostico/envio<\/code>, con el permiso <code>diagnostico:autoevaluar<\/code>. La entidad y el usuario salen del token. Responde 200 con <code>{enviadoEn}<\/code>.<\/li>\n<li>Exige las ocho dimensiones calificadas; si faltan, responde 422 con la lista de dimensiones sin calificar. Es un supuesto (SUP21) que Diego debe confirmar.<\/li>\n<li>Responde 409 si la entidad ya lo envió. Después del envío, el <code>PUT<\/code> también responde 409 (<code>AutodiagnosticoEnviadoException<\/code>) y el autodiagnóstico no se reabre (supuesto, por confirmar).<\/li>\n<li><code>GET<\/code> y <code>PUT<\/code> suman <code>enviadoEn<\/code> (nulo si no se ha enviado), para que la pantalla bloquee los campos al abrir y no se entere por el 409, como pasa hoy con la finalización de formularios.<\/li>\n<li>Bitácora: el evento <code>AUTODIAGNOSTICO_ENVIADO<\/code>.<\/li>\n<li>Un solo punto de consulta, <code>AutodiagnosticoService.estaEnviado(entidad)<\/code>. Lo usa el diagnóstico oficial (H-12.2): sin envío, <code>PUT /api/diagnostico/{entidad}/oficial<\/code> y <code>PUT /api/diagnostico/{entidad}/aporte-expertos<\/code> responden 409 (FR096). Se revisa primero la asignación (403) y después el envío (409).<\/li>\n<li>Interfaz: botón «Enviar autodiagnóstico» con confirmación y la entrada al menú del beneficiario (<code>rol_menu<\/code>).<\/li>\n<li>Asignación de entidades a Gestor GMA (TK-22, FR123, historia H-3.6, ya en main con PR #84). La tabla provisional de T-12.2.1 la completa <code>V12_04<\/code>. H-13.1 depende de esta asignación.<\/li>\n<li>Un solo servicio, <code>AsignacionDeGestores<\/code>, en <code>campus/hojaderuta/service<\/code>. Lo usan H-12.2 y H-13.1, y nadie más lee <code>gestor_entidad<\/code>. El servicio provisional de T-12.2.1 se sustituye por este sin cambiar a quienes lo llaman.<\/li>\n<li>Consulta: <code>entidadesDe(gestor)<\/code> y <code>exigirAsignada(gestor, entidad)<\/code>. Regla: el Gestor sale del token y la entidad de la ruta (D07). Sin asignación, 403; también 403 si la entidad no existe, para no revelar cuáles hay.<\/li>\n<li>Administración, con el permiso nuevo <code>gestores:asignar-entidades<\/code> (solo <code>campus:administrador-campus<\/code>):<ul>\n<li><code>GET /api/gestores<\/code> lista las personas Gestor para elegir, con cuántas entidades tiene cada una, y filtra por texto.<\/li>\n<li><code>GET /api/gestores/{gestor}/entidades<\/code> lista las entidades asignadas.<\/li>\n<li><code>PUT /api/gestores/{gestor}/entidades/{entidad}<\/code> asigna. Asignar de nuevo lo ya asignado no repite nada ni deja registro, igual que habilitar integradores (H-3.4).<\/li>\n<li><code>DELETE /api/gestores/{gestor}/entidades/{entidad}<\/code> retira. Si no estaba asignada, responde 404.<\/li>\n<\/ul>\n<\/li>\n<li>Bitácora: <code>GESTOR_ENTIDAD_ASIGNADA<\/code> y <code>GESTOR_ENTIDAD_RETIRADA<\/code>, con gestor y entidad. El retiro borra la fila; la historia queda en la bitácora, que solo se agrega (D10).<\/li>\n<li>La pantalla del Administrador Campus no existe en el prototipo: UX debe diseñarla antes de construirla (ver «Preguntas abiertas»).<\/li>\n<li>Portal público (H-7.2, TK-25, PR #30): <code>GET /api/publico/convocatorias<\/code> y <code>POST /api/publico/inquietudes<\/code>, sin sesión, en <code>campus/convocatoria<\/code>. Son rutas públicas por método y ruta (ver «Tres reglas de seguridad»).<\/li>\n<li>La respuesta de la lista es la clase <code>ConvocatoriaPublicada<\/code>: nombre, términos, formulario, apertura, cierre, tipologías y actos. No trae topes, cupos, evaluadores, subcriterios ni criterios de empate, porque el PRD no los declara públicos.<\/li>\n<li>Una convocatoria está abierta entre la apertura y el cierre del cronograma, ambos incluidos, con la hora del servidor (D13). Sin fechas no aparece.<\/li>\n<li>La inquietud exige reCAPTCHA antes de validar o guardar (donde esté habilitado) y solo acepta una convocatoria abierta. Responde 201 sin cuerpo y no envía correo.<\/li>\n<li>La bitácora deja <code>INQUIETUD_RECIBIDA<\/code> sin datos personales.<\/li>\n<li>Excepción temporal: el nombre del formulario sale de un <code>LEFT JOIN<\/code> de solo lectura a la tabla <code>formulario<\/code>. Choca con «un módulo no lee las tablas de otro» (NFR017). Deuda: una interfaz de consulta que implemente el módulo de formularios y que <code>convocatoria<\/code> use en su lugar.<\/li>\n<li>Diagnóstico oficial (H-12.2, TK-26, PR #31): vive en <code>campus/hojaderuta<\/code> y exige el permiso <code>diagnostico:oficial<\/code> (solo <code>campus:gestor-gma<\/code>). Es el diagnóstico del Gestor GMA sobre una entidad asignada.<\/li>\n<li>API: <code>GET<\/code> y <code>PUT /api/diagnostico/{entidad}/oficial<\/code>, <code>GET<\/code> y <code>PUT /api/diagnostico/{entidad}/aporte-expertos<\/code> y <code>GET /api/diagnostico/{entidad}/autodiagnostico<\/code>.<\/li>\n<li>La entidad sale de la ruta y el Gestor del token (D07). Sin asignación responde 403, sin revelar si la entidad existe. La consulta va detrás del servicio de asignación provisional, que H-3.6 reemplaza sin cambiar a quien lo llama.<\/li>\n<li>Emitir va en el mismo <code>PUT<\/code> con <code>{\"emitir\": true}<\/code>. Exige las ocho dimensiones (400 si falta alguna). Ya emitido, cualquier cambio responde 409, incluido el aporte de expertos.<\/li>\n<li>Cada escritura bloquea la fila de la entidad (<code>MERGE<\/code> más <code>SELECT FOR UPDATE<\/code>), para que borrador y emisión no se crucen.<\/li>\n<li>La validación de 1 a 4 se comparte con el autodiagnóstico (<code>CalificacionesDelFormulario<\/code>).<\/li>\n<li>Bitácora: <code>DIAGNOSTICO_OFICIAL_GUARDADO<\/code>, <code>APORTE_EXPERTOS_GUARDADO<\/code> y <code>DIAGNOSTICO_OFICIAL_EMITIDO<\/code>.<\/li>\n<li>Hasta que se construya T-12.1.2 el diagnóstico oficial no exige el autodiagnóstico enviado. Luego pasa a exigirlo (409), como ya dice el envío del autodiagnóstico (TK-23).<\/li>\n<li>Circuito de firmas (H-14.1, PR #64, por unirse): <code>CircuitoDeFirmas<\/code> (dominio, función pura) y <code>CircuitoDeFirmasService<\/code> viven en <code>campus/hojaderuta<\/code>, no en <code>campus/firmas<\/code>, porqu
